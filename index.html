function legacyBacklog(){const p=planning(),scrum=currentBoard().type==='Scrum';const sections=[['ideas','Brain Dump','Capture an idea in seconds. Only a title is needed.'],['triage','Triage & Refinement','Discuss with the team. Clarify the problem, scope, acceptance criteria and priority.'],['ready',scrum?'Ready for Sprint':'Ready to Start',scrum?'Refined work available for sprint planning. Not yet selected for a sprint.':'Prioritised work to pull onto the board when capacity is available.']];const edit=p.items.find(t=>t.id===state.planEdit);return `<div class="row spread"><h1>Backlog</h1>${button('Open board','view:board')}</div><label>Board<select data-planning-board="true">${currentProject().boards.map(b=>`<option value="${b.id}" ${b.id===state.boardId?'selected':''}>${esc(b.name)} · ${b.type}</option>`).join('')}</select></label><p class="muted small">Drag tickets between sections or reorder within a section. Click a title to refine it.</p>${sections.map(([phase,title,help])=>`<section><div class="row spread"><h2>${title} <span class="tag">${p.items.filter(t=>t.phase===phase).length}</span></h2></div><p class="muted small">${help}</p>${phase==='ideas'?`<label>New idea<input id="nx-plan-idea" placeholder="An idea, feature request or improvement…"></label>${button('+ Add idea','planadd','primary')}`:''}${planningRows(phase)}</section>`).join('')}${scrum?`<section><div class="row spread"><h2>Sprint Backlog</h2>${!p.sprint?button('Create sprint','plancreatesprint'):''}</div>${p.sprint?`<div class="panel"><h3>${esc(p.sprint.name)} · ${p.sprint.closed?'Closed':p.sprint.active?'Active':'Planned'}</h3><p>${esc(p.sprint.goal)}</p><p class="muted small">${p.sprint.start} → ${p.sprint.end} · ${p.items.filter(t=>t.phase==='sprint').length} selected tickets</p>${planningRows('sprint')}${p.sprint.closed?button('Review closed sprint','view:sprint'):!p.sprint.active?button('Start sprint','planstartsprint','primary'):button('Open active sprint','view:board')}</div>`:'<p class="muted small">Create a named sprint, then select tickets from Ready for Sprint.</p>'}${state.planSprintForm?`<div class="panel"><h3>Plan a sprint</h3><label>Sprint name<input id="nx-sprint-name" placeholder="e.g. Sprint 1"></label><label>Sprint goal<textarea id="nx-sprint-goal" placeholder="What outcome will this sprint deliver?"></textarea></label><div class="grid"><label>Start date<input id="nx-sprint-start" type="date"></label><label>End date<input id="nx-sprint-end" type="date"></label></div><div class="row">${button('Create sprint','plansavesprint','primary')}${button('Cancel','plancancel')}</div></div>`:''}</section>`:`<section class="nx-plan-drop nx-plan-board-target" data-plan-drop="board" aria-label="Move ready work to the board"><h2>Move to board</h2><p class="muted small">Drop a ready ticket here when the team has capacity.</p></section>`}${edit?`<section class="panel"><h2>Refine ticket</h2><label>Title<input id="nx-plan-title" value="${esc(edit.title)}"></label><label>Type<select id="nx-plan-type">${['Story','Bug'].map(v=>`<option ${edit.type===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Description<textarea id="nx-plan-description">${esc(edit.description)}</textarea></label><label>Acceptance criteria<textarea id="nx-plan-criteria">${esc(edit.criteria)}</textarea></label><div class="grid"><label>Priority<select id="nx-plan-priority">${['Low','Medium','High','Critical'].map(v=>`<option ${edit.priority===v?'selected':''}>${v}</option>`).join('')}</select></label><label>Assignee<select id="nx-plan-owner">${['Unassigned',...new Set([...state.accessPeople.map(p=>p.name),'Maya','Alex'])].map(v=>`<option ${edit.owner===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label></div><label>Story points (optional)<select id="nx-plan-points">${['',0,1,2,3,5,8,13].map(v=>`<option value="${v}" ${String(edit.points??'')===String(v)?'selected':''}>${v===''?'Unestimated':v}</option>`).join('')}</select></label><p class="muted small">Title, description and acceptance criteria are needed to mark ready. An assignee can be chosen later.</p>${edit.phase!=='ideas'?childSection(edit.id):''}<div class="row">${button('Save ticket','plansave','primary')}${button('Cancel','plancancel')}</div></section>`:''}`;}
function planningCards(stage){const p=currentBoard().planning;if(!p)return '';return p.items.filter(t=>(t.phase==='board'||t.phase==='sprint'&&p.sprint?.active)&&(t.status||currentBoard().workflow.stages[0])===stage).map(t=>`<div class="ticket"><strong>${esc(t.title)}</strong><span>${esc(t.type)} · ${esc(t.priority)} · ${esc(t.owner)}${t.points!==undefined&&t.points!==''?' · '+esc(t.points)+' pts':''}</span>${t.children?.length?'<span>'+childCount(t.children)+'</span>':''}<label>Status<select data-plan-status="${t.id}">${currentBoard().workflow.stages.map(s=>`<option ${(t.status||currentBoard().workflow.stages[0])===s?'selected':''}>${esc(s)}</option>`).join('')}</select></label>${button('Details','plandetail:'+t.id)}</div>`).join('');}

const timelineNames=[['Project discovery and navigation','Mobile project experience','Document search and organisation','Ticket ownership and notifications','Board workflow customisation','Access Center improvements','Release readiness checks','Performance and accessibility'],['Customer onboarding redesign','Saved board views','Bulk ticket updates','Project activity digest','Document version history','Dependency visibility','Mobile notification controls','Team workload overview'],['Customer feedback portal','Reusable project templates','Advanced search filters','External integrations','Offline mobile access','Audit history export','Cross-project reporting','Localisation support'],['Project creation foundation','Ticket creation form','Board type selection','Basic member management','File uploads','Story and bug types','Priority selection','Project overview foundation']];
function epicStories(epic){const custom=currentProject().customEpics?.some(t=>t.id===epic.id);const base=custom?[]:Array.from({length:10},(_,i)=>({title:['Define scope and acceptance criteria','Design the experience','Build the primary flow','Add validation and error states','Verify permissions','Test on mobile','Review accessibility','Run regression checks','Prepare release notes','Verify launch readiness'][i],owner:['Maya','Alex','Anoop'][i%3],status:i<epic.baseDone?'Done':i===epic.baseDone&&epic.group==='Active Now'?'In Progress':'To Do',points:[2,3,5][i%3]}));const linked=currentProject().boards.flatMap(b=>(b.planning?.items||[]).filter(t=>t.epicId===epic.id).map(t=>({...t,board:b.id,status:t.status||b.workflow.stages[0]})));return linked.length?linked:base;}
function epicFields(epic={},prefix='nx-epic'){return `<label>Description<textarea id="${prefix}-description" rows="3" placeholder="Describe the problem, context and scope…">${esc(epic.description||'')}</textarea></label><label>Goal / expected outcome<textarea id="${prefix}-goal" rows="2" placeholder="What should this epic achieve?">${esc(epic.goal||'')}</textarea></label><label>Acceptance criteria<textarea id="${prefix}-criteria" rows="3" placeholder="How will the team know this epic is complete?">${esc(epic.criteria||'')}</textarea></label>`;}
function epicPriority(epic={},prefix="nx-epic"){return `<label>Priority<select id="${prefix}-priority">${['Low','Medium','High','Critical'].map(v=>`<option ${(epic.priority||'Medium')===v?'selected':''}>${v}</option>`).join('')}</select></label>`;}
function readEpicFields(prefix){const fields=Object.fromEntries(['description','goal','criteria','priority'].map(key=>[key,root.querySelector('#'+prefix+'-'+key).value]));fields.reporter=root.querySelector('#'+prefix+'-reporter')?.value||'Anoop';fields.labels=root.querySelector('#'+prefix+'-labels')?.value||'';for(const key of ['points','originalEstimate','loggedTime','remainingTime'])fields[key]=root.querySelector('#'+prefix+'-'+key)?.value||'';fields.activity=readActivity(root.querySelector('#nx-epic-modal'));fields.loggedTime=fields.activity.workLogs.reduce((sum,w)=>sum+Number(w.hours),0);fields.createdAt=state.epicDraft?.createdAt||new Date().toISOString();fields.extraFields=readExtras(root.querySelector('#nx-epic-modal [data-extra-list]'));fields.updatedAt=new Date().toISOString();if(prefix==='nx-epic'){fields.descriptionHtml=root.querySelector('[data-epic-rich] [data-rich-editor]')?.innerHTML||state.epicDraft?.descriptionHtml||'';}return fields;}
function epicStoryRows(epic){return epicStories(epic).map((t,i)=>`<article class="nx-refined-story"><button class="nx-epic-work-row" data-open-epic-story="${i}"><span class="nx-story-type-icon" aria-label="${t.type==='Bug'?'Bug':'User story'}" title="${t.type==='Bug'?'Bug':'User story'}">${t.type==='Bug'?'●':'▤'}</span><span class="nx-story-key">${esc(t.key||('STORY-'+String(i+1).padStart(3,'0')))}</span><span class="nx-story-row-title">${esc(t.title)}</span><span class="tag small">${esc(t.status)}</span><span class="nx-story-avatar" title="${esc(t.owner||'Unassigned')}" aria-label="Assignee: ${esc(t.owner||'Unassigned')}">${esc((t.owner||'?').slice(0,1))}</span><span class="nx-story-points" title="Story points">${t.points===''?'—':esc(t.points??'—')}</span></button></article>`).join('');}
function epicDetail(epic){const draft=state.epicDraft||epic;return `<header class="row spread nx-modal-header"><div><span class="muted small">${esc(epic.id)} · Epic</span><h2 id="nx-epic-heading">${esc(epic.name)}</h2></div>${button('Close','timelineclose')}</header><div class="nx-modal-body"><section class="nx-epic-overview"><label>Epic title<input id="nx-epic-title" value="${esc(draft.name)}"></label><label>Goal / expected outcome<textarea id="nx-epic-goal" rows="2" placeholder="What outcome will this epic deliver?">${esc(draft.goal||'')}</textarea></label><div class="nx-epic-metadata">${epicPriority(draft)}<label>Owner<select id="nx-epic-owner">${['Unassigned','Maya','Alex','Anoop'].map(n=>`<option ${n===draft.owner?'selected':''}>${n}</option>`).join('')}</select></label><label>Status<select id="nx-epic-group">${['Active Now','Up Next','Backlog','Completed'].map(g=>`<option ${g===draft.group?'selected':''}>${g}</option>`).join('')}</select></label><label>Start date<input id="nx-epic-start" type="date" value="${draft.start||''}"></label><label>Target date<input id="nx-epic-end" type="date" value="${draft.end||''}"></label></div><details class="nx-epic-support"><summary>Description & acceptance criteria</summary><label>Description<textarea id="nx-epic-description" rows="3">${esc(draft.description||'')}</textarea></label><label>Acceptance criteria<textarea id="nx-epic-criteria" rows="3">${esc(draft.criteria||'')}</textarea></label></details></section><details class="nx-epic-stories nx-epic-linked-work" open><summary><span class="nx-linked-work-label">Stories and bugs <span class="nx-linked-work-count">${epicStories(epic).length}</span></span><span class="muted small">${epicStories(epic).filter(t=>t.status==='Done').length} of ${epicStories(epic).length} work items done · ${epicStories(epic).filter(t=>t.type!=='Bug').length} stories · ${epicStories(epic).filter(t=>t.type==='Bug').length} bugs</span></summary><p class="muted small">Select a story or bug to view its d root.addEventListener('click',e=>{const b=e.target.closest('[data-open-epic-story]');if(!b)return;captureEpicDraft();rememberEpicStoryPosition(b);const epic=timelineData().find(t=>t.id===state.timelineSelected),index=Number(b.dataset.openEpicStory);let stories=epicStories(epic),t=stories[index];if(!t)return;if(!t.board||!t.id){const board=currentBoard(),items=planning().items,stamp='2026-10-07T09:00:00';let key=1+Math.max(0,...currentProject().boards.flatMap(b=>(b.planning?.items||[]).map(t=>Number(t.key?.split('-').pop())||0)));stories=stories.map((story,i)=>{const status=board.workflow.stages.includes(story.status)?story.status:board.workflow.stages[0];const item={...story,id:'epic-story-'+epic.id+'-'+i,key:(currentProject().key||'NX')+'-'+key++,board:board.id,homeBoardId:board.id,epicId:epic.id,phase:'ideas',type:'Story',priority:i===0?'High':'Medium',status,description:'As a team member, I want to '+story.title.toLowerCase()+' so that we can deliver '+epic.name+' with confidence.',criteria:'The agreed scope is implemented and reviewed.\nExpected behaviour and error cases are verified.\nThe product owner confirms the outcome.',children:i%3===0?sampleEpicChildren(story).map((c,j)=>({...c,id:'epic-child-'+epic.id+'-'+i+'-'+j,type:'Task',priority:'Medium',description:j===0?'Implement the agreed changes and request a peer review.':'Verify the expected behaviour, edge cases, and acceptance criteria.',status:board.workflow.stages.includes(c.status)?c.status:board.workflow.stages[0]})):[],createdAt:stamp,updatedAt:stamp,statusChangedAt:stamp};items.push(item);return item;});t=stories[index];save();}state.boardId=t.board;applyWorkflow(currentBoard().workflow);cleanTicketDialog(t.phase,t.id);const close=root.querySelector('#ux-modal .nx-ticket-header [data-ux-cancel]');if(close){close.textContent='Back to epic';close.setAttribute('aria-label','Back to epic');}decorateEpicStoryNavigation(epic,t);});

function timelineData(){const groups=['Active Now','Up Next','Backlog','Completed'];const rows=state.projectId==='website'?timelineNames.flatMap((names,g)=>names.map((name,i)=>{const completed=g===3?10:g===0?[7,4,8,6,3,5,9,4][i]:g===1?[0,1,0,0,0,0,1,0][i]:0;const start=g===3?'2026-08-'+String(2+i*2).padStart(2,'0'):g===0?'2026-09-'+String(2+i*2).padStart(2,'0'):g===1?'2026-11-'+String(2+i*2).padStart(2,'0'):'';const end=g===3?'2026-09-20':g===0?'2026-11-'+String(10+i*2).padStart(2,'0'):g===1?'2027-01-20':'';const id='EP-'+(101+g*100+i);return {id,name,boardId:currentProject().boards[i%currentProject().boards.length].id,group:groups[g],team:['Product','Engineering','Design','QA'][i%4],owner:['Maya','Alex','Anoop','Unassigned'][i%4],done:completed,baseDone:completed,total:10,start,end,...currentProject().timelineOverrides?.[id]};})):[];return [...rows,...(currentProject().customEpics||[])].filter(t=>(t.boardId||currentProject().boards[0].id)===state.boardId).map(t=>{const stories=epicStories(t);return {...t,total:stories.length,done:stories.filter(x=>x.status==='Done').length};});}
function timeline(){const all=timelineData(),q=(state.timelineSearch||'').toLowerCase(),items=all.filter(t=>(t.name+' '+t.id+' '+t.owner+' '+t.team).toLowerCase().includes(q)),base=new Date(Date.UTC(2026,9+(state.timelineOffset||0),1)),end=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+3,1)),months=Array.from({length:3},(_,i)=>new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+i,1))),selected=all.find(t=>t.id===state.timelineSelected),today=new Date('2026-10-07T12:00:00Z'),todayPct=(today-base)/(end-base)*100;const row=t=>{const a=t.start?new Date(t.start+'T00:00:00Z'):null,b=t.end?new Date(t.end+'T23:59:59Z'):null,visible=a&&b&&b>=base&&a<end,left=visible?Math.max(0,(a-base)/(end-base)*100):0,right=visible?Math.min(100,(b-base)/(end-base)*100):0,pct=t.total?Math.round(t.done/t.total*100):0;return `<tr><td><button class="nx-epic-name nx-refined-epic" data-action="timelineepic:${t.id}">${esc(t.name)}</button><p class="muted small">${esc(t.id)} · ${esc(t.owner)}</p><p class="muted small">${a&&b?esc(a.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}))+" – "+esc(b.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"})):"Dates not set"}</p></td><td><span>${t.done}/${t.total}</span><p class="muted small">work items done</p></td><td class="nx-timeline-track" colspan="3"><div class="nx-month-grid" aria-hidden="true"></div>${todayPct>=0&&todayPct<=100?`<span class="nx-today-line" style="left:${todayPct}%" aria-hidden="true"></span>`:''}${visible?`<button class="nx-time-bar nx-time-${t.group.replaceAll(' ','').toLowerCase()}" style="left:${left}%;width:${Math.max(1,right-left)}%" data-action="timelineepic:${t.id}" aria-label="${esc(t.name)}, ${t.start} to ${t.end}, ${pct} percent complete"><span class="nx-time-fill" style="width:${pct}%"></span><span>${pct}%</span></button>`:''}</td></tr>`;};return `<div class="row spread"><div><h1>Timeline</h1><p class="muted small">${esc(state.name)} · Plan outcomes and track epic delivery</p></div>${button('+ Create epic','epicnew:Up Next','primary')}</div><div class="nx-timeline-tools"><label>Board<select data-planning-board="true">${currentProject().boards.map(b=>`<option value="${b.id}" ${b.id===state.boardId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label><label>Find an epic<input id="nx-timeline-search" value="${esc(state.timelineSearch||'')}" placeholder="Search title, key, team or owner"></label></div><div class="row spread nx-timeline-range"><strong>${base.toLocaleDateString('en-US',{month:'short',year:'numeric',timeZone:'UTC'})} – ${months[2].toLocaleDateString('en-US',{month:'short',year:'numeric',timeZone:'UTC'})}</strong><div class="row"><button data-action="timelineprevious" aria-label="Previous three months">←</button>${button('Today','timelinetoday')}<button data-action="timelinenext" aria-label="Next three months">→</button></div></div><p class="muted small">${items.length} epics · Progress counts completed work items, not effort. Vertical marker: Oct 7, 2026 · Sample data.</p>${all.length?`<div class="nx-timeline-scroll"><table class="nx-timeline-table nx-refined-timeline"><colgroup><col style="width:35%"><col style="width:11%">${months.map(()=>'<col style="width:18%">').join('')}</colgroup><thead><tr><th>Epic / Owner</th><th>Progress</th>${months.map(m=>'<th>'+m.toLocaleDateString('en-US',{month:'short',timeZone:'UTC'})+'</th>').join('')}</tr></thead><tbody>${['Active Now','Up Next','Backlog','Completed'].map(group=>{const list=items.filter(t=>t.group===group),collapsed=q?false:state.timelineCollapsed?.[group]??['Backlog','Completed'].includes(group);return `<tr class="nx-time-group"><th colspan="5"><div class="nx-timeline-group-actions"><button data-action="timelinegroup:${group}" aria-expanded="${!collapsed}">${collapsed?'▸':'▾'} ${group} <span class="tag small">${list.length}</span></button><button class="nx-timeline-add" data-action="epicnew:${group}">+ Add epic</button></div></th></tr>${collapsed?'':list.map(row).join('')}`;}).join('')}</tbody></table>${!items.length?'<p class="muted">No matching epics.</p>':''}</div>`:'<div class="panel"><h2>No epics yet</h2><p>Add an epic to plan a larger outcome. Dates can be added later.</p>'+button('Create first epic','epicnew:Up Next','primary')+'</div>'}${state.newEpicGroup||selected?epicModal(selected):''}`;}
function overviewTickets(){if(state.projectId!=='website'||state.boardId!=='delivery')return [];return [{id:'WEB-12',title:'Homepage review',owner:'Maya',date:'2026-10-08',status:state.status},{id:'WEB-13',title:'Mobile QA',owner:state.overviewQaOwner||'Alex',date:state.overviewQaDate||'2026-10-04',status:'In Progress'},{id:'WEB-14',title:'Release notes',owner:state.overviewNotesOwner||'Unassigned',date:'',status:'To Do'},{id:'WEB-15',title:'Launch brief',owner:'Anoop',date:'',status:'Done'},{id:'WEB-16',title:'Assets audit',owner:'Anoop',date:'',status:'Done'}];}
function legacyOverview(){const tickets=overviewTickets(),done=tickets.filter(t=>t.status==='Done').length,open=tickets.length-done;const flags=t=>[t.status==='Blocked'?'Blocked':'',t.status!=='Done'&&t.date&&t.date<'2026-10-05'?'Overdue':'',t.status!=='Done'&&t.owner==='Unassigned'?'Unassigned':''].filter(Boolean);const attention=tickets.filter(t=>flags(t).length);const filter=state.overviewFilter||'All';const visible=attention.filter(t=>filter==='All'||flags(t).includes(filter));return `<div class="row spread"><h1>Overview</h1>${button('Open board','view:board')}</div><label>Board<select data-overview-board="true">${currentProject().boards.map(b=>`<option value="${b.id}" ${b.id===state.boardId?'selected':''}>${esc(b.name)} · ${b.type}</option>`).join('')}</select></label><p class="muted small">Lead: ${esc(currentBoard().owner)} · ${currentBoard().type==='Scrum'?'All board tickets · No active sprint':'All board tickets'} · Sample snapshot: Oct 5</p>${!state.setupComplete?'<div class="row spread panel"><span>Finish project setup to confirm your workspace.</span>'+button('Continue setup','resumesetup')+'</div>':''}${tickets.length?`<div class="grid"><div class="panel"><h2>${open} open</h2><p class="muted small">Tickets still to complete</p></div><div class="panel"><h2>${done} of ${tickets.length} done</h2><div class="progress" role="progressbar" aria-label="Completed tickets" aria-valuemin="0" aria-valuemax="${tickets.length}" aria-valuenow="${done}"><div style="width:${done/tickets.length*100}%"></div></div><p class="muted small">Ticket count, not effort completed</p></div><div class="panel"><h2>${attention.length} need attention</h2><p class="muted small">Unique tickets with a blocker, missed date or no owner</p></div></div><h2>Needs attention</h2><div class="row">${['All','Overdue','Unassigned',...(currentBoard().workflow.stages.includes('Blocked')?['Blocked']:[])].map(f=>button(f+' · '+attention.filter(t=>f==='All'||flags(t).includes(f)).length,'overviewfilter:'+f,filter===f?'active':'')).join('')}</div><div aria-live="polite">${visible.length?visible.map(t=>`<div class="item row spread"><div><strong>${esc(t.title)}</strong><p class="muted small">${t.id} · ${esc(t.owner)}${t.date?' · Due '+t.date:''}</p><span class="tag">${flags(t).join(' · ')}</span>${t.status==='Blocked'?'<p class="muted small">'+esc(state.blockerReason||'No blocker reason recorded')+'</p>':''}</div>${button(t.id==='WEB-14'?'Assign owner':t.id==='WEB-13'?'Review due date':'Review blocker',t.id==='WEB-12'?'view:ticket':'overviewedit:'+t.id)}</div>`).join(''):'<p class="muted">No '+(filter==='All'?'tickets need attention':filter.toLowerCase()+' tickets')+'.</p>'}</div>${state.overviewEdit?`<div class="panel"><h3>${state.overviewEdit==='WEB-14'?'Assign Release notes':'Review Mobile QA'}</h3>${state.overviewEdit==='WEB-14'?`<label>Owner<select id="nx-overview-owner">${['Maya','Alex','Anoop'].map(n=>'<option>'+n+'</option>').join('')}</select></label>`:`<p class="muted small">Confirm a realistic date with the owner before updating.</p><label>Due date<input id="nx-overview-date" type="date" value="${esc(state.overviewQaDate||'2026-10-04')}"></label>`}<div class="row">${button('Save change','overviewsave','primary')}${button('Cancel','overviewcancel')}</div></div>`:''}<details><summary>Project goal & context</summary><p>${esc(state.purpose)}</p><p class="muted small">Project lead: Anoop · Target: Oct 16</p></details>`:`<div class="panel"><h2>No tickets yet</h2><p class="muted">Progress and attention items will appear when this board has tickets.</p>${button('Add first ticket','newticket','primary')}${button('Preview populated example','overviewexample')}</div>`}`;}

function legacyBoard(){ensureBoardWorkflows();if(state.projectId!=='website'||state.boardId!=='delivery')return `<div class="row spread"><h1>${esc(currentBoard().name)}</h1>${button('Rename board','renameboard')}</div><p class="muted">${esc(state.name)} · ${currentBoard().type} board</p><div class="row">${button('Add ticket','placeholder','primary')}${currentBoard().type==='Scrum'?button(currentBoard().planning?.sprint?.active?'Sprint planning':'Plan sprint','view:backlog'):''}</div><div class="columns">${state.stages.map(s=>'<section class="column"><h3>'+esc(s)+'</h3>'+(planningCards(s)||'<p class="muted">No tickets</p>')+'</section>').join('')}</div>`;return `<div class="row spread"><h1>${esc(currentBoard().name)}</h1>${button('Rename board','renameboard')}</div><div class="row"><label>Show<select data-field="filter"><option>All tickets</option>${state.stages.includes('Blocked')?`<option ${state.filter==='Blocked'?'selected':''}>Blocked</option>`:''}<option ${state.filter==='Overdue'?'selected':''}>Overdue</option><option ${state.filter==='Mine'?'selected':''}>Mine</option></select></label>${button('Add ticket','newticket','primary')}<span class="muted">Click a card to open details</span></div><div class="columns">${state.stages.map((s,i)=>`<section class="column"><h3>${esc(s)}</h3>${planningCards(s)}${(s===state.status&&(state.filter==='All tickets'||(state.filter==='Blocked'&&state.status==='Blocked')))?`<button class="ticket cursor-interaction" data-action="view:ticket">Homepage review<span>WEB-12 · Story · High</span><span>${esc(state.status)} · Maya</span><span>${childCount(childList('main'))}</span><span>Due Oct 8 ${state.ticketChecklist!=='None'?'· Checklist '+state.checks.filter(Boolean).length+'/3':''}</span></button>`:''}${i===1&&(state.filter==='All tickets'||state.filter==='Overdue'&&(state.overviewQaDate||'2026-10-04')<'2026-10-05')?`<button class="ticket cursor-interaction" data-action="view:ticket">Mobile QA<span>WEB-13 · Bug · ${esc(state.overviewQaOwner||'Alex')}</span><span>${(state.overviewQaDate||'2026-10-04')<'2026-10-05'?'Overdue · ':''}Due ${esc(state.overviewQaDate||'2026-10-04')}</span></button>`:''}${i===0&&state.filter==='All tickets'?'<p class="muted small">Release notes · '+esc(state.overviewNotesOwner||'Unassigned')+'</p>':''}${s==='Done'&&['All tickets','Mine'].includes(state.filter)?'<p class="muted small">Launch brief · Done · You</p><p class="muted small">Assets audit · Done · You</p>':''}</section>`).join('')}</div>`;}
function ticket(){const count=state.checks.filter(Boolean).length;return `<section class="nx-ticket-dialog" aria-label="Ticket details"><div class="row spread"><h2>Ticket details</h2><div class="row">${state.status==='Blocked'?button('Blocked · Details','blockdetails'):''}${button('Close','view:board')}</div></div>${state.blockerEditor&&state.status==='Blocked'?`<div class="panel"><h3>Blocked stage details</h3><label>Reason <span class="muted small">(optional)</span><input data-field="blockerReason" value="${esc(state.blockerReason)}" placeholder="What is preventing progress?"></label><label>Resolution owner <span class="muted small">(optional)</span><select data-field="blockerOwner">${['Unassigned','Maya','Alex','Anoop'].map(o=>`<option ${o===state.blockerOwner?'selected':''}>${o}</option>`).join('')}</select></label><div class="row">${button('Save details','saveblockdetails')}${button('Return to '+esc(state.previousStatus),'returnstage')}</div></div>`:''}<p class="muted small">WEB-12</p><label>Type<select><option>Story</option><option>Bug</option></select></label><label>Title<input value="Homepage review"></label><label>Description<textarea rows="3">Verify the homepage against the launch brief and acceptance criteria.</textarea></label><label>Assignee<select><option>Maya · Project member</option><option>Alex · Project member</option><option>Anoop · Project admin</option><option>Unassigned</option></select></label><label>Epic<select><option>Website launch</option><option>No epic</option></select></label><label>Priority<select><option>Low</option><option>Medium</option><option selected>High</option><option>Critical</option></select></label><div class="grid"><label>Status<select data-field="status">${state.stages.map(s=>`<option ${s===state.status?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label>Due date<input type="date" value="2026-10-08"></label></div><div id="nx-gate" role="status" aria-live="polite"></div><label>Ticket checklist<select data-field="ticketChecklist" ${state.gate?'disabled':''}><option ${state.ticketChecklist==='None'?'selected':''}>None</option><option ${state.ticketChecklist==='Release readiness'?'selected':''}>Release readiness</option></select></label>${state.gate?'<p class="muted small">Required by this workflow. An admin can change the workflow requirement.</p>':'<p class="muted small">Optional: choose a template or leave this ticket without a checklist. Switching to None keeps the items available if you re-enable it.</p>'}${state.ticketChecklist!=='None'?`<div class="panel"><div class="row spread"><h2>Release readiness</h2><span>${count}/3 complete</span></div><div class="progress"><div style="width:${count/3*100}%"></div></div>${state.items.map((t,i)=>`<div class="item"><input aria-label="${esc(t)}" type="checkbox" data-check="${i}" ${state.checks[i]?'checked':''}><span>${esc(t)}</span><span class="tag small">${state.gate?'Required':'Optional'}</span></div>`).join('')}${state.extra.map(esc).map(t=>`<p>○ ${t} <span class="muted small">Optional</span></p>`).join('')}<label>Add items · one per line<textarea id="nx-additems" rows="2" placeholder="Add a step or paste several"></textarea></label><div class="row">${button('Add items','additems')}${button('Use template','view:templates')}${button('Save as template','savetemplate')}</div></div>`:'<div class="panel"><h2>No checklist on this ticket</h2>'+button('Add checklist','applytemplate')+'</div>'}${childSection('main')}<div class="panel"><h2>Discussion & activity</h2><p><span class="tag">Maya</span> @Alex Can you confirm when the brand assets are ready?</p>${state.status==='Blocked'?'<p class="muted small">Moved to Blocked from '+esc(state.previousStatus)+'</p>':''}<p class="muted small">Anoop set the due date to Oct 8 · Today, 09:30</p>${state.comment?'<p>You: '+esc(state.comment)+'</p>':''}<label>Comment<textarea id="nx-comment" placeholder="Write a comment or @mention a teammate"></textarea></label>${button('Post comment','comment')} function legacyWorkflow(){return `<h1>Workflows</h1><p class="muted">Select a board to edit its stages and requirements. New boards start with the workflow chosen during project setup. A project admin or board owner confirms changes for this board.</p><label>Board<select data-workflow-board="true">${currentProject().boards.map(b=>`<option value="${b.id}" ${b.id===state.boardId?'selected':''}>${esc(b.name)} · ${b.type}</option>`).join('')}</select></label><div class="row">${['Simple','Review & deliver','Custom'].map(t=>button(t,'preset:'+t,state.template===t?'active':'')).join('')}</div><div class="panel"><h2>Stages</h2><p class="muted small">Rename stages, choose a category, and reorder. The first stage is the starting stage.</p>${state.stages.map((s,i)=>`<div class="stage"><input aria-label="Stage ${i+1}" data-stage="${i}" value="${esc(s)}"><select aria-label="Category for ${esc(s)}"><option ${i===0?'selected':''}>To do</option><option ${i>0&&i<state.stages.length-1?'selected':''}>In progress</option><option ${i===state.stages.length-1?'selected':''}>Done</option></select><div class="row">${button('↑','up:'+i)}${button('−','remove:'+i)}</div></div>`).join('')}${button('+ Add stage','addstage')}<label class="check"><input type="checkbox" data-field="includeBlocked" ${state.stages.includes('Blocked')?'checked':''}> Include Blocked as a workflow stage</label><p class="muted small">Optional. Adds a distinct board column and ticket status. In QA remains a separate stage.</p></div><div class="panel"><h2>Movement & requirements</h2><label>How can tickets move?<select data-field="movement"><option ${state.movement==='Flexible'?'selected':''}>Flexible</option><option ${state.movement==='Step by step'?'selected':''}>Step by step</option></select></label><p class="muted">Flexible allows any stage. Step by step allows the next stage or the previous stage. If included, Blocked can be entered from any unfinished stage and returns to the previous stage.</p>${workflowChecklistControls()}<details><summary>Advanced transition rules</summary><p>Example: In Review → Done · Only project admins may complete this transition.</p><label>Who may move tickets to Done?<select><option>Any project member</option><option>Project admins only</option></select></label><p class="muted small">Advanced rules are optional. Apply the same checks to dropdown changes and drag-and-drop.</p></details></div><div class="flow">${state.stages.map(esc).join('</span> → <span>').replace(/^/,'<span>')}</span></div><div class="row">${button('Preview transition','preview')}${button('Publish workflow','publish','primary')}${button('Save draft','savedraft')}${button('Back to board','view:board')}</div><div id="nx-workflow-result" aria-live="polite"></div>`;}
function checklistLibrary(){return currentProject().checklistLibrary??=[{id:'release',name:'Release readiness',items:['Acceptance criteria verified','Mobile layout checked','Release notes approved']},{id:'story',name:'Story readiness',items:['Problem and outcome are clear','Acceptance criteria reviewed','Dependencies identified','Story estimated with the team']},{id:'bug',name:'Bug verification',items:['Reproduce the issue','Verify the fix','Check for regression']}];}
function templates(){const list=checklistLibrary();return `<div class="row spread"><div><h1>Checklist templates</h1><p class="muted">Reusable steps your team can attach to user stories.</p></div><button class="primary" data-checklist-template="new">Create template</button></div><div class="nx-checklist-help"><strong>How teams use these</strong><p class="muted small">Open a user story → choose a template in Checklist → complete the items as work progresses.</p><p class="muted small">Each story gets its own copy. Updating a template keeps existing story checklists intact.</p></div><div class="nx-checklist-library">${list.map(t=>`<article class="panel"><div class="row spread"><h2>${esc(t.name)}</h2><span class="tag">${t.items.length} items</span></div><ul class="nx-template-preview">${t.items.map(i=>'<li><span aria-hidden="true">□</span>'+esc(i)+'</li>').join('')}</ul><div class="row"><button data-checklist-template="edit" data-template-id="${t.id}">Edit template</button><button data-checklist-template="duplicate" data-template-id="${t.id}">Duplicate</button></div></article>`).join('')}</div>`;}
