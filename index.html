function documentAddDialog(kind){uxDialog(`<h2 id="ux-title">${kind==='file'?'Upload file':'Add document link'}</h2><form id="nx-document-form" data-kind="${kind}">${kind==='file'?'<label>File<input type="file" name="file" required></label>':'<label>Document URL<input type="url" name="url" placeholder="https://" required></label>'}<label>Display name<input name="name" ${kind==='link'?'required':''} placeholder="${kind==='file'?'Uses the file name if left blank':'Give the link a clear name'}"></label><label>Category<select name="category">${['PRDs','Workflow diagrams','Retro notes','Other'].map(c=>'<option>'+c+'</option>').join('')}</select></label><label>Short description <span class="muted">(optional)</span><textarea name="description" rows="2"></textarea></label><label>Linked epic <span class="muted">(optional)</span><select name="linked"><option value="">Project reference</option>${documentWorkOptions().map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('')}</select></label><p id="nx-doc-error" class="muted"></p><div class="row"><button type="submit" class="primary">${kind==='file'?'Upload file':'Add link'}</button><button type="button" data-ux-cancel>Cancel</button></div></form>`);}
root.addEventListener('change',e=>{if(e.target.matches('[data-doc-search]')){state.documentSearch=e.target.value;render();}if(e.target.matches('[data-doc-category]')){state.documentCategory=e.target.value;render();}});
root.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a==='docupload')documentAddDialog('file');if(a==='doclink')documentAddDialog('link');if(a?.startsWith('docopen:')){const d=projectDocuments().find(d=>d.id===a.slice(8));if(!d)return;const preview=d.kind==='file'&&d.url&&(/^(image\/|application\/pdf)/.test(d.mime||''));uxDialog(`<h2 id="ux-title">${esc(d.name)}</h2><p class="muted small">${esc(d.category)} · ${esc(d.owner)} · ${esc(d.date)}</p><p>${esc(d.description||'No description added.')}</p>${d.linked?'<p><strong>Linked epic:</strong> '+esc(d.linked)+'</p>':''}${preview?(d.mime.startsWith('image/')?`<img src="${esc(d.url)}" alt="${esc(d.name)}" style="max-width:100%;max-height:420px;object-fit:contain">`:`<iframe title="${esc(d.name)}" src="${esc(d.url)}" style="width:100%;height:420px;border:1px solid var(--nx-line)"></iframe>`):''}${d.kind==='sample'?'<p class="muted">This is a sample entry. Upload a file to try preview and download.</p>':''}<div class="row">${d.kind==='link'?`<a class="primary" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">Open document ↗</a>`:d.url?`<a href="${esc(d.url)}" download="${esc(d.fileName)}">Download file</a>`:''}<button data-ux-cancel>Close</button></div>`);}});
root.addEventListener('submit',e=>{if(e.target.id!=='nx-document-form')return;e.preventDefault();const f=new FormData(e.target),kind=e.target.dataset.kind,file=f.get('file');let url=f.get('url');if(kind==='link'){try{const parsed=new URL(url);if(!['http:','https:'].includes(parsed.protocol))throw new Error();}catch{root.querySelector('#nx-doc-error').textContent='Use an http or https document link.';return;}}else{if(!file?.size)return;url=URL.createObjectURL(file);}projectDocuments().unshift({id:'doc-'+Date.now(),kind,url,name:f.get('name').trim()||file.name,fileName:kind==='file'?file.name:'',mime:kind==='file'?file.type:'',category:f.get('category'),description:f.get('description').trim(),linked:f.get('linked'),owner:'You',date:new Date().toISOString().slice(0,10)});root.querySelector('#ux-modal').close();state.documentCategory='All';state.documentSearch='';render();notice(kind==='file'?'File added to project documents.':'Document link added.');});


root.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!['accessadd','accesspermissions'].includes(a)&&!a?.startsWith('accessremove:'))return;e.stopImmediatePropagation();if(a==='accesspermissions'){uxDialog(`<h2 id="ux-title">Project roles</h2><div class="panel"><h3>Member</h3><p>View project work, create and update tickets, add documents, and comment.</p></div><div class="panel"><h3>Admin</h3><p>Everything a Member can do, plus manage project access, workflows and ticket fields.</p></div><p class="muted small">The project lead remains an Admin. Project visibility also controls access for people outside this list.</p><button data-ux-cancel>Close</button>`);return;}if(a==='accessadd'){const available=['Jordan','Sam'].filter(name=>!state.accessPeople.some(p=>p.name===name));uxDialog(`<h2 id="ux-title">Add people</h2><p class="muted">Give an existing Nexa teammate access to every board in ${esc(state.name)}.</p>${available.length?`<form id="nx-access-add-form"><label>Person<select name="person">${available.map(n=>'<option>'+n+'</option>').join('')}</select></label><label>Project role<select name="role"><option>Member</option><option>Admin</option></select></label><p class="muted small">Members work on tickets and documents. Admins also manage project settings and access.</p><div class="row"><button type="submit" class="primary">Add to project</button><button type="button" data-ux-cancel>Cancel</button></div></form>`:'<p>All available sample teammates already have access.</p><button data-ux-cancel>Close</button>'}`);return;}const person=state.accessPeople.find(p=>p.id===+a.slice(13));if(!person||person.lead)return;uxDialog(`<h2 id="ux-title">Remove ${esc(person.name)}?</h2><p>They will lose their assigned project access. Reassign their unfinished work before removing them.</p><form id="nx-access-remove-form" data-id="${person.id}"><label>Reassign unfinished tickets and child tasks to<select name="owner"><option>Unassigned</option>${state.accessPeople.filter(p=>p.id!==person.id).map(p=>'<option>'+esc(p.name)+'</option>').join('')}</select></label><p class="muted small">Their comments and completed work stay in the project. Organization access may still apply in Limited or Open projects.</p><div class="row"><button type="submit">Reassign & remove</button><button type="button" data-ux-cancel>Cancel</button></div></form>`);},true);
root.addEventListener('submit',e=>{if(!['nx-access-add-form','nx-access-remove-form'].includes(e.target.id))return;e.preventDefault();const f=new FormData(e.target);if(e.target.id==='nx-access-add-form'){const name=f.get('person');if(state.accessPeople.some(p=>p.name===name))return;state.accessPeople.push({id:Date.now(),name,email:name.toLowerCase()+'@example.com',role:f.get('role')});}else{const id=+e.target.dataset.id,person=state.accessPeople.find(p=>p.id===id);if(!person||person.lead)return;currentProject().boards.forEach(b=>(b.planning?.items||[]).forEach(t=>{if(t.owner===person.name&&t.status!=='Done')t.owner=f.get('owner');(t.children||[]).forEach(c=>{if(c.owner===person.name&&c.status!=='Done')c.owner=f.get('owner');});}));state.accessPeople=state.accessPeople.filter(p=>p.id!==id);}root.querySelector('#ux-modal').close();render();save();notice('Project access updated in this mockup.');});

function notificationItems(){const p=currentProject();if(!p.notificationFeed){const b=p.boards.find(b=>b.type==='Scrum'&&b.planning?.items?.length)||currentBoard(),tickets=b.planning?.items||[],t=tickets.find(t=>t.phase==='sprint')||tickets[0];p.notificationFeed=[{id:'mention',kind:'Mentions',title:'Maya mentioned you in a ticket',detail:'“Can you confirm the acceptance criteria before we proceed?”',time:'10 minutes ago',board:b.id,ticket:t?.id,read:false},{id:'assigned',kind:'Assignments',title:'Alex assigned a ticket to you',detail:t?.title||'Review the next piece of work with your team.',time:'45 minutes ago',board:b.id,ticket:t?.id,read:false},{id:'scope',kind:'Sprint changes',title:'Sprint scope was updated',detail:'New work was added. Review the scope history and the reason for the change.',time:'2 hours ago',board:b.id,view:'sprint',read:false},{id:'blocker',kind:'Blockers',title:'A delivery blocker needs attention',detail:'Check the team’s recorded blockers in Sprint workspace.',time:'Yesterday',board:b.id,view:'sprint',read:true}];}const prefs=personalNotificationPreferences();for(const event of p.mentionNotifications||[]){if(event.recipient==='Anoop'&&prefs.Mentions&&!p.notificationFeed.some(n=>n.id===event.id))p.notificationFeed.unshift({...event});}return p.notificationFeed;}
function notifications(){const all=notificationItems(),filter=state.notificationFilter||'All',visible=all.filter(n=>(filter!=='Unread'||!n.read)),unread=all.filter(n=>!n.read).length;return `<div class="row spread"><div><h1>Notifications</h1><p class="muted">Updates for you in ${esc(state.name)}.</p></div><div class="row">${button('Preferences','view:notificationPreferences')}${button('Mark all as read','notifreadall')}</div></div><div class="nx-notif-tools"><div class="row"><button data-action="notiffilter:All" class="${filter==='All'?'primary':''}">All</button><button data-action="notiffilter:Unread" class="${filter==='Unread'?'primary':''}">Unread · ${unread}</button></div></div><div>${visible.length?visible.map(n=>`<div class="nx-notif-row ${n.read?'':'nx-notif-unread'}"><span class="nx-notif-dot" aria-label="${n.read?'Read':'Unread'}">${n.read?'':'●'}</span><div><span class="muted small">${esc(n.kind)} · ${esc(n.time)}</span><h3>${esc(n.title)}</h3><p class="muted small">${esc(n.detail)}</p></div><div class="row">${button(n.ticket?'Open ticket':'Open sprint','notifopen:'+n.id)}${button(n.read?'Mark unread':'Mark read','notiftoggle:'+n.id)}</div></div>`).join(''):'<div class="panel"><h2>You’re all caught up</h2><p class="muted">No updates match this view.</p></div>'}</div><p class="muted small">Sample notifications · Actions demonstrate the flow; no messages are sent.</p>`;}
function notificationPreferences(){state.notificationPreferences=personalNotificationPreferences();return `<div class="row spread"><div><h1>Notification preferences</h1><p class="muted">Choose the updates you want to receive in Nexa.</p></div>${button('Back to notifications','view:notifications')}</div><form id="nx-notification-preferences" class="panel"><h2>Your updates</h2>${[['Mentions','When someone @mentions you in a story, child task, or epic comment. Open the notification to return to that work item.'],['Assignments','When a ticket is assigned to you.'],['Blockers','When work assigned to you becomes blocked.'],['Sprint changes','When scope changes or a sprint starts or closes on your Scrum boards.']].map(([k,d])=>`<label class="nx-notif-pref"><input type="checkbox" name="${k}" ${state.notificationPreferences[k]?'checked':''}><span><strong>${k}</strong><span class="muted small">${d}</span></span></label>`).join('')}<p class="muted small">These are your personal preferences. They do not change your teammates’ settings. Delivery is simulated in this mockup; existing notifications stay in your feed.</p><button type="submit" class="primary">Save preferences</button></form>`;}
root.addEventListener('change',e=>{if(e.target.matches('[data-notif-kind]')){state.notificationKind=e.target.value;render();}});
root.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a?.startsWith('notif'))return;const all=notificationItems();if(a==='notifreadall'){all.forEach(n=>n.read=true);render();return;}if(a.startsWith('notiffilter:')){state.notificationFilter=a.slice(12);render();return;}if(a.startsWith('notiftoggle:')){const n=all.find(n=>n.id===a.slice(12));n.read=!n.read;render();return;}if(a.startsWith('notifopen:')){const n=all.find(n=>n.id===a.slice(10));n.read=true;state.boardId=n.board;if(n.epic){state.timelineSelected=n.epic;state.epicDraft=null;nav('epics');}else if(n.ticket){const t=planning().items.find(t=>t.id===n.ticket);render();if(t)cleanTicketDialog(t.phase,t.id);else notice('This ticket is no longer available.');}else nav(n.view);}});
root.addEventListener('submit',e=>{if(e.target.id!=='nx-notification-preferences')return;e.preventDefault();const f=new FormData(e.target);state.notificationPreferences=Object.fromEntries(['Mentions','Assignments','Blockers','Sprint changes'].map(k=>[k,f.has(k)]));try{localStorage.setItem('nexa-notification-preferences-'+currentProject().id,JSON.stringify(state.notificationPreferences));}catch{}save();notice('Your notification preferences are saved in this mockup.');});


let boardDragId=null,boardSuppressClickUntil=0;
root.addEventListener('dragstart',e=>{const card=e.target.closest('[data-board-ticket]');if(!card)return;boardDragId=card.dataset.boardTicket;e.dataTransfer.setData('text/nexa-board-ticket',boardDragId);e.dataTransfer.effectAllowed='move';card.classList.add('nx-card-dragging');});
root.addEventListener('dragover',e=>{if(!boardDragId)return;const lane=e.target.closest('[data-board-drop]');if(!lane)return;e.preventDefault();e.dataTransfer.dropEffect='move';root.querySelectorAll('.nx-board-drop-active').forEach(x=>x.classList.remove('nx-board-drop-active'));lane.classList.add('nx-board-drop-active');const lanes=root.querySelector('.nx-board-swimlanes')||root.querySelector('.nx-board-lanes');if(lanes){const r=lanes.getBoundingClientRect();if(e.clientX>r.right-55)lanes.scrollLeft+=18;if(e.clientX<r.left+55)lanes.scrollLeft-=18;}});
root.addEventListener('drop',e=>{const lane=e.target.closest('[data-board-drop]');if(!lane||!boardDragId)return;e.preventDefault();const t=planning().items.find(t=>t.id===boardDragId),stage=lane.dataset.boardDrop;boardSuppressClickUntil=Date.now()+500;boardDragId=null;root.querySelectorAll('.nx-board-drop-active').forEach(x=>x.classList.remove('nx-board-drop-active'));if(!t||!currentBoard().workflow.stages.includes(stage))return;if((stage==='Done'&&doneChecklistRemaining(t).length)||workflowRuleMissing(t,stage).length){transitionChecklistDialog(t,stage);return;}if(stage==='Done'&&unfinishedStoryBugs(t).length){uxDialog(`<h2 id="ux-title">Resolve linked bugs first</h2><p>This story has unresolved required fixes.</p><ul>${unfinishedStoryBugs(t).map(b=>`<li>${esc(b.title)}</li>`).join('')}</ul><button data-ux-cancel>Got it</button>`);return;}if(stage==='Done'&&(t.blocker||(t.children||[]).some(c=>c.status!=='Done'))){uxDialog(`<h2 id="ux-title">This ticket isn’t ready for Done</h2><p>${t.blocker?'Resolve its blocker before completing it.':'Complete its unfinished child tasks before completing it.'}</p><button data-ux-cancel>Got it</button>`);return;}triggerWorkflowRules(t,stage);render();save();notice('Ticket moved to '+stage+'.');});
root.addEventListener('dragend',()=>{boardDragId=null;boardSuppressClickUntil=Date.now()+500;root.querySelectorAll('.nx-card-dragging,.nx-board-drop-active').forEach(x=>x.classList.remove('nx-card-dragging','nx-board-drop-active'));});
root.addEventListener('click',e=>{if(Date.now()<boardSuppressClickUntil&&e.target.closest('[data-board-ticket]')){e.preventDefault();e.stopImmediatePropagation();return;}const b=e.target.closest('[data-board-block]');if(!b)return;e.stopImmediatePropagation();const t=planning().items.find(t=>t.id===b.dataset.boardBlock);uxDialog(`<h2 id="ux-title">${t.blocker?'Review blocker':'Mark ticket blocked'}</h2><p><strong>${esc(t.title)}</strong></p><p class="muted small">The ticket stays in ${esc(t.status||currentBoard().workflow.stages[0])}. A blocker flag shows the team it needs help.</p><form id="nx-board-block-form" data-id="${t.id}"><label>What is blocking progress?<textarea name="reason" required>${esc(t.blocker||'')}</textarea></label><label>Who will help resolve it?<select name="owner"><option>Unassigned</option>${state.accessPeople.map(p=>`<option ${p.name===t.resolutionOwner?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="row"><button type="submit" class="primary">${t.blocker?'Save blocker':'Mark blocked'}</button>${t.blocker?`<button type="button" data-board-unblock="${t.id}">Resolve & unblock</button>`:''}<button type="button" data-ux-cancel>Cancel</button></div></form>`);},true);
root.addEventListener('submit',e=>{if(e.target.id!=='nx-board-block-form')return;e.preventDefault();const t=planning().items.find(t=>t.id===e.target.dataset.id),f=new FormData(e.target),reason=f.get('reason').trim();if(!reason)return;t.blocker=reason;t.resolutionOwner=f.get('owner');root.querySelector('#ux-modal').close();render();save();notice('Ticket marked blocked. It remains in its current column.');});
root.addEventListener('click',e=>{const b=e.target.closest('[data-board-unblock]');if(!b)return;const t=planning().items.find(t=>t.id===b.dataset.boardUnblock);t.blockerHistory??=[];t.blockerHistory.push({reason:t.blocker,owner:t.resolutionOwner,resolvedAt:new Date().toISOString()});t.blocker='';t.resolutionOwner='';root.querySelector('#ux-modal').close();render();save();notice('Blocker resolved. The ticket can continue from its current column.');});

function positionProjectPopover(){const pop=root.querySelector('#nx-project-popover'),trigger=root.querySelector('[data-action="openpicker"]');if(!pop||!trigger)return;pop.showPopover();const r=trigger.getBoundingClientRect();pop.style.left=Math.max(8,Math.min(r.left,innerWidth-296))+'px';pop.style.top=Math.min(r.bottom+6,Math.max(8,innerHeight-pop.offsetHeight-8))+'px';}
document.addEventListener('click',e=>{if(picker.open&&!e.target.closest('.nx-project-picker,[data-action="openpicker"]')){picker.open=false;root.querySelector('#nx-project-popover')?.hidePopover();root.querySelector('[data-action="openpicker"]')?.setAttribute('aria-expanded','false');}});
window.addEventListener('resize',()=>{if(picker.open)positionProjectPopover();});
root.addEventListener('keydown',e=>{if(!picker.open||!e.target.closest('.nx-project-picker'))return;if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const buttons=[...root.querySelectorAll('.nx-simple-project')],index=buttons.indexOf(document.activeElement);buttons[(index+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();}});

function ensureDoneChecklist(t){const w=currentBoard().workflow;if(!w.workflowChecklist||w.workflowChecklist==='None')return;const texts=w.doneChecklistItems||checklistLibrary().find(c=>c.name===w.workflowChecklist)?.items||[],previous=t.workflowChecklist?.items||[];t.workflowChecklist={name:w.workflowChecklist,items:texts.map(text=>({text,done:previous.some(i=>i.text===text&&i.done)}))};}
function doneChecklistRemaining(t){if(!currentBoard().workflow.gate||currentBoard().workflow.workflowChecklist==='None')return [];ensureDoneChecklist(t);return (t.workflowChecklist?.items||[]).filter(i=>!i.done);}
function doneChecklistSection(t){const w=currentBoard().workflow;if(!w.workflowChecklist||w.workflowChecklist==='None')return '';const items=t?.workflowChecklist?.items||((w.doneChecklistItems||checklistLibrary().find(c=>c.name===w.workflowChecklist)?.items||[]).map(text=>({text,done:false})));return `<section class="nx-story-checklist"><div class="row spread"><h3>${w.gate?'Required for Done':'Done checklist · Optional'}</h3><span class="tag">Workflow</span></div><p class="muted small">${esc(w.workflowChecklist)} · Set by this board’s workflow.</p>${items.map(i=>`<label class="check" data-done-check-row><input type="checkbox" ${i.done?'checked':''}><span>${esc(i.text)}</span></label>`).join('')}</section>`;}
function readDoneChecklist(){const items=[...root.querySelectorAll('#clean-ticket-form [data-done-check-row]')].map(row=>({text:row.querySelector('span').textContent,done:row.querySelector('input').checked}));return {name:currentBoard().workflow.workflowChecklist,items};}
root.addEventListener('change',e=>{if(!e.target.matches('[data-done-rule]'))return;state.gate=e.target.value==='required';saveBoardDraft();render();save();});
root.addEventListener('submit',e=>{if(e.target.id!=='clean-ticket-form'||!currentBoard().workflow.gate)return;const f=e.target;if(new FormData(f).get('ticketStatus')==='Done'&&readDoneChecklist().items.some(i=>!i.done)){e.preventDefault();e.stopImmediatePropagation();f.querySelector('#clean-form-error').textContent='Complete the Required for Done checklist before finishing this story.';}},true);

function publishedChecklistRules(){return currentBoard().workflow.checklistRules||[];}
function draftChecklistRules(){return currentBoard().checklistRuleDraft??=clone(publishedChecklistRules());}
function ruleSentence(r){return r.when==='During'?`During ${r.to}`:`${r.when} moving from ${r.from} to ${r.to}`;}
function workflowChecklistControls(){const rules=draftChecklistRules();return `<section class="panel"><div class="row spread"><div><h2>Checklist rules</h2><p class="muted small">When should a checklist appear in this workflow?</p></div><button data-checklist-rule="add">+ Add rule</button></div>${rules.map(r=>`<div class="nx-rule-row"><div><strong>${esc(ruleSentence(r))}</strong><p class="muted small">${esc(r.name)} · <strong>${r.when==='Before'&&r.required?'Required — blocks this move':'Reminder — does not block movement'}</strong></p></div><div class="row"><button data-checklist-rule="edit" data-rule-id="${r.id}">Edit</button><button data-checklist-rule="remove" data-rule-id="${r.id}">Remove</button></div></div>`).join('')||'<p class="muted">No rules yet. Add a checklist before a move, during a stage, or after a move.</p>'}<p class="muted small">Required rules must use Before. During and After are reminders.</p>${JSON.stringify(rules)!==JSON.stringify(publishedChecklistRules())?'<div class="alert">Unpublished checklist changes. Use Review & publish, then Confirm & publish to apply them to this board.</div>':'<p class="muted small">These rules are published on this board.</p>'}</section>`;}
function ruleEditor(r={},draft={}){const d={required:r.required??true,when:r.when||'Before',from:r.from||editingStages('settings')[0].name,to:r.to||editingStages('settings')[1]?.name,...r,...draft},stages=editingStages('settings').map(s=>s.name.trim());uxDialog(`<h2 id="ux-title">${r.id?'Edit':'Add'} checklist rule</h2><form id="nx-rule-form" data-id="${r.id||''}"><label>1. When?<select name="when" data-rule-when>${['Before','During','After'].map(w=>`<option ${w===d.when?'selected':''}>${w}</option>`).join('')}</select></label><p class="muted small">${d.when==='Before'?'Prepare work before the ticket moves.':d.when==='During'?'Track work while the ticket is in this stage.':'Attach follow-up steps after the ticket moves.'}</p><h3>2. Where?</h3>${d.when!=='During'?`<label>From<select name="from">${stages.map(s=>`<option ${s===d.from?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`:''}<label>${d.when==='During'?'Stage':'To'}<select name="to">${stages.map(s=>`<option ${s===d.to?'selected':''}>${esc(s)}</option>`).join('')}</select></label><label>3. Which checklist?<select name="template">${checklistLibrary().map(t=>`<option value="${t.id}" ${t.id===d.template?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label>${d.when==='Before'?`<label class="check"><input type="checkbox" name="required" ${d.required?'checked':''}>Require completion before this move</label>`:''}<p id="nx-rule-error" role="alert"></p>${uxFooter()}</form>`);}

function splitInformationSections(text){const lines=text.split(/\r?\n/),sections=[];let current=null;for(const line of lines){const clean=line.trim(),heading=clean&&clean.length<=70&&!/^[•\-\d]/.test(clean)&&(/^#{1,3}\s+/.test(clean)||/:$/.test(clean)||/^[A-Z][A-Z\s&/()-]+$/.test(clean)||/^(out of scope|definition of done|dependencies|assumptions|technical notes|test context|references)$/i.test(clean));if(heading){current={title:clean.replace(/^#{1,3}\s+/,'').replace(/:$/,'').toLowerCase().replace(/^./,c=>c.toUpperCase()),body:''};sections.push(current);}else{if(!current){current={title:'',body:''};sections.push(current);}current.body+=(current.body?'\n':'')+line;}}return sections.map(s=>({...s,body:s.body.trim()})).filter(s=>s.title||s.body);}

function activityData(item){return item?.activity||{comments:(item?.comments||[]).map(c=>({...c,id:'comment-'+Math.random()})),workLogs:[],attachments:[]};}
function activitySection(item,kind){const data=activityData(item);return `<section class="nx-ticket-activity" data-ticket-activity data-kind="${kind}" data-item-id="${esc(item?.id||'')}" data-activity="${esc(JSON.stringify(data))}"><div class="row spread"><h3>Activity</h3><span class="muted small" data-activity-total>${data.comments.length+data.workLogs.length+data.attachments.length} entries</span></div><div class="nx-activity-tabs" role="tablist" aria-label="Ticket activity">${[['comments','Comments'],['workLogs','Work log'],['attachments','Attachments']].map(([key,label],i)=>`<button type="button" role="tab" aria-selected="${i===0}" data-activity-tab="${key}">${label} <span>${data[key].length}</span></button>`).join('')}</div><div data-activity-panel>${activityPanel(data,'comments')}</div><p class="nx-activity-feedback muted small" role="status"></p></section>`;}
function activityTime(entry){return esc(entry.time||new Date(entry.createdAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}));}
function activityPanel(data,tab){const rows=data[tab]||[];const list=rows.length?`<div class="nx-activity-entries">${rows.slice().reverse().map(entry=>`<article class="nx-activity-entry"><div class="row spread"><strong>${esc(entry.author||'Anoop')}${tab==='workLogs'?` <span class="tag small">${entry.hours}h</span>`:''}</strong><span class="muted small">${activityTime(entry)}</span></div>${tab==='attachments'?`<a class="nx-attachment-link" href="${esc(entry.url)}" download="${esc(entry.name)}">▧ ${esc(entry.name)}</a><span class="muted small">${Math.max(1,Math.round(entry.size/1024))} KB</span>`:`<p>${tab==='comments'?mentionCommentHtml(entry):esc(entry.note||'Work logged').replace(/\n/g,'<br>')}</p>${tab==='workLogs'?`<span class="muted small">Worked on ${esc(entry.date)}</span>`:''}`}</article>`).join('')}</div>`:`<p class="nx-activity-empty muted small">${({comments:'No comments yet. Share an update or ask a question.',workLogs:'No work logged yet. Record time spent on this item.',attachments:'No attachments yet. Add designs, screenshots, or supporting files.'})[tab]}</p>`;return `${tab==='comments'?`<label class="nx-activity-composer">Add a comment<textarea data-activity-comment rows="2" placeholder="Share an update… Type @ to mention someone." aria-autocomplete="list" aria-expanded="false"></textarea><div class="nx-mention-picker" data-mention-picker role="listbox" aria-label="Project members" hidden></div></label><button type="button" class="primary" data-activity-post="comment">Post comment</button>`:tab==='workLogs'?`<div class="nx-log-work-fields"><label>Time spent (hours)<input data-activity-hours type="number" min="0.25" step="0.25" placeholder="e.g. 1.5"></label><label>Date worked<input data-activity-date type="date" value="${new Date().toISOString().slice(0,10)}"></label></div><label>Work description <span class="muted small">(optional)</span><textarea data-activity-note rows="2" placeholder="What did you work on?"></textarea></label><div class="row spre function readActivity(container){const section=container?.querySelector('[data-ticket-activity][data-kind="story"],[data-ticket-activity][data-kind="epic"]');return section?JSON.parse(section.dataset.activity):{comments:[],workLogs:[],attachments:[]};}
function activityTimeFields(section){const kind=section.dataset.kind,container=kind==='child'?section.closest('[data-child-draft]'):kind==='story'?section.closest('form'):section.closest('dialog');const field=key=>container?.querySelector(kind==='child'?'[data-child-standard="'+key+'"]':kind==='story'?'[name="'+key+'"]':'[id$="-'+key+'"]');return {original:field('originalEstimate'),remaining:field('remainingTime'),logged:field('loggedTime')};}
function recalculateActivityTime(section,data){const previous=JSON.parse(section.dataset.activity),fields=activityTimeFields(section),oldTotal=previous.workLogs.reduce((sum,w)=>sum+Number(w.hours),0),total=data.workLogs.reduce((sum,w)=>sum+Number(w.hours),0),current=fields.remaining?.value??'',original=fields.original?.value??'';let forecast=previous.remainingForecast;if(current!==''&&(forecast===undefined||Math.abs(Number(current)-Math.max(0,forecast-oldTotal))>.0001))forecast=Number(current)+oldTotal;if(forecast===undefined&&original!=='')forecast=Number(original);if(forecast!==undefined){data.remainingForecast=forecast;if(fields.remaining)fields.remaining.value=Math.round(Math.max(0,forecast-total)*100)/100;}if(fields.logged)fields.logged.value=total;return {loggedTime:total,remainingTime:fields.remaining?.value||'',originalEstimate:original};}
function updateActivity(section,data,message){const time=recalculateActivityTime(section,data);section.dataset.activity=JSON.stringify(data);const tab=section.querySelector('[aria-selected="true"]').dataset.activityTab;section.querySelector('[data-activity-panel]').innerHTML=activityPanel(data,tab);section.querySelector('[data-activity-total]').textContent=(data.comments.length+data.workLogs.length+data.attachments.length)+' entries';section.querySelectorAll('[data-activity-tab]').forEach(b=>b.querySelector('span').textContent=data[b.dataset.activityTab].length);section.querySelector('.nx-activity-feedback').textContent=message;const id=section.dataset.itemId;if(id){let item;if(section.dataset.kind==='epic'){item=currentProject().customEpics?.find(t=>t.id===id);if(!item){currentProject().timelineOverrides??={};item=currentProject().timelineOverrides[id]??={};}if(state.epicDraft){state.epicDraft.activity=data;state.epicDraft.remainingTime=time.remainingTime;}}else if(section.dataset.kind==='child'){const row=section.closest('[data-child-draft]'),child=JSON.parse(row.dataset.childSavedFields||'{}');child.activity=data;child.remainingTime=time.remainingTime;child.originalEstimate=time.originalEstimate;child.loggedTime=data.workLogs.reduce((sum,w)=>sum+Number(w.hours),0);row.dataset.childSavedFields=JSON.stringify(child);const logged=row.querySelector('[data-child-standard="loggedTime"]');if(logged)logged.value=child.loggedTime;item=planning().items.flatMap(t=>t.children||[]).find(c=>c.id===id);}else item=currentProject().boards.flatMap(b=>b.planning?.items||[]).find(t=>t.id===id);if(item){item.activity=data;item.remainingTime=time.remainingTime;item.originalEstimate=time.originalEstimate;item.updatedAt=new Date().toISOString();{item.loggedTime=data.workLogs.reduce((sum,w)=>sum+Number(w.hours),0);const logged=section.dataset.kind==='child'?section.closest('[data-child-draft]').querySelector('[data-child-standard="loggedTime"]'):section.dataset.kind==='story'?section.closest('form').querySelector('[name="loggedTime"]'):root.querySelector('#nx-epic-loggedTime');if(logged)logged.value=item.loggedTime;}save();}}else section.querySelector('.nx-activity-feedback').textContent=message+' Create the ticket to keep these entries.';}
root.addEventListener('click',e=>{const tab=e.target.closest('[data-activity-tab]'),post=e.target.closest('[data-activity-post]');if(!tab&&!post)return;const section=(tab||post).closest('[data-ticket-activity]'),data=JSON.parse(section.dataset.activity);if(tab){section.querySelectorAll('[data-activity-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===tab)));section.querySelector('[data-activity-panel]').innerHTML=activityPanel(data,tab.dataset.activityTab);section.querySelector('.nx-activity-feedback').textContent='';return;}const entry={id:'activity-'+Date.now(),author:'Anoop',createdAt:new Date().toISOString()};if(post.dataset.activityPost==='comment'){const text=section.querySelector('[data-activity-comment]').value.trim();if(!text){section.querySelector('.nx-activity-feedback').textContent='Write a comment before posting.';return;}const composer=section.querySelector('[data-activity-comment]'),mentions=JSON.parse(composer.dataset.selectedMentions||'[]').filter(m=>text.includes('@'+m.name));const comment={...entry,text,mentions};data.comments.push(comment);updateActivity(section,data,'Comment posted.');queueMentionNotifications(section,comment);}else{const hours=Number(section.querySelector('[data-activity-hours]').value),date=section.querySelector('[data-activity-date]').value;if(!Number.isFinite(hours)||hours<=0||!date){section.querySelector('.nx-activity-feedback').textContent='Enter a positive time and a date.';return;}data.workLogs.push({...entry,hours,date,note:section.querySelector('[data-activity-note]').value.trim()});updateActivity(section,data,'Work logged.');}});

root.addEventListener('change',e=>{const input=e.target;if(!input.matches('[name="originalEstimate"],[name="remainingTime"],[data-child-standard="originalEstimate"],[data-child-standard="remainingTime"],[id$="-originalEstimate"],[id$="-remainingTime"]'))return;const row=input.closest('[data-child-draft]'),container=row||input.closest('form')||input.closest('dialog'),section=container?.querySelector(row?'[data-kind="child"]':container?.id==='clean-ticket-form'?'[data-kind="story"]':'[data-kind="epic"]');if(!section)return;const data=JSON.parse(section.dataset.activity),fields=activityTimeFields(section),total=data.workLogs.reduce((sum,w)=>sum+Number(w.hours),0);if(input===fields.remaining){if(input.value==='')delete data.remainingForecast;else data.remainingForecast=Number(input.value)+total;}else if(fields.remaining?.value===''&&input.value!==''){data.remainingForecast=Number(input.value);fields.remaining.value=Math.max(0,Number(input.value)-total);}section.dataset.activity=JSON.stringify(data);});
function personalNotificationPreferences(){try{const stored=localStorage.getItem('nexa-notification-preferences-'+currentProject().id);if(stored)return JSON.parse(stored);}catch{}return state.notificationPreferences||{Mentions:true,Assignments:true,Blockers:true,'Sprint changes':true};}
function mentionCommentHtml(entry){let text=esc(entry.text);for(const member of entry.mentions||[]){const token=esc('@'+member.name);text=text.split(token).join('<span class="nx-comment-mention">'+token+'</span>');}return text.replace(/\n/g,'<br>');}
function mentionQuery(input){const before=input.value.slice(0,input.selectionStart),match=before.match(/(?:^|\s)@([^@\n]{0,40})$/);return match?{query:match[1],start:input.selectionStart-match[1].length-1,end:input.selectionStart}:null;}
function showMentionPicker(input){const picker=input.parentElement.querySelector('[data-mention-picker]'),query=mentionQuery(input);if(!query){picker.hidden=true;input.setAttribute('aria-expanded','false');return;}const people=state.accessPeople.filter(p=>p.name.toLowerCase().includes(query.query.toLowerCase()));picker.innerHTML=people.length?people.map((p,i)=>`<button type="button" role="option" aria-selected="${i===0}" data-mention-member="${esc(String(p.id))}"><span class="nx-mention-avatar">${esc(p.name[0])}</span><span><strong>${esc(p.name)}</strong><span class="muted small">${esc(p.email||'Project member')}</span></span></button>`).join(''):'<p class="muted small">No project members found.</p>';picker.hidden=false;input.setAttribute('aria-expanded','true');}

root.addEventListener('keydown',e=>{const input=e.target;if(!input.matches('[data-activity-comment]'))return;const picker=input.parentElement.querySelector('[data-mention-picker]');if(picker.hidden)return;const options=[...picker.querySelectorAll('[data-mention-member]')],index=Math.max(0,options.findIndex(b=>b.getAttribute('aria-selected')==='true'));if(e.key==='Escape'){e.preventDefault();e.stopPropagation();picker.hidden=true;input.setAttribute('aria-expanded','false');}else if(['ArrowDown','ArrowUp'].includes(e.key)&&options.length){e.preventDefault();const next=(index+(e.key==='ArrowDown'?1:-1)+options.length)%options.length;options.forEach((b,i)=>b.setAttribute('aria-selected',String(i===next)));options[next].scrollIntoView({block:'nearest'});}else if(['Enter','Tab'].includes(e.key)&&options.length){e.preventDefault();selectCommentMention(options[index]);}});
function queueMentionNotifications(section,comment){const members=comment.mentions.filter(m=>m.name!==comment.author);if(!members.length)return;const project=currentProject();project.mentionNotifications??=[];let ticket=section.dataset.kind==='story'?section.dataset.itemId:null;if(section.dataset.kind==='child')ticket=section.closest('form')?.dataset.id;const epic=section.dataset.kind==='epic'?section.dataset.itemId:null;if(!ticket&&!epic){section.querySelector('.nx-activity-feedback').textContent='Comment added. Create this item to keep it and its mentions.';return;}for(const member of members){const isCurrent=member.name==='Anoop',enabled=!isCurrent||personalNotificationPreferences().Mentions;if(!enabled)continue;project.mentionNotifications.push({id:'mention-'+comment.id+'-'+member.id,kind:'Mentions',title:comment.author+' mentioned you in a comment',detail:comment.text,time:'Just now',recipient:member.name,board:currentBoard().id,ticket,epic,read:false});}save();section.querySelector('.nx-activity-feedback').textContent='Comment posted · Mentioned '+members.map(m=>m.name).join(', ')+'.';}

      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );
      next.addEventListener("click", () =>
        select((active + 1) % panels.length),
      );
      picker.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && picker.open) {
          event.preventDefault();
          picker.open = false;
          mousePointerId = null;
          summary.focus();
          return;
        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
