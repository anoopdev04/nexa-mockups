function ticketChecklistSection(t){const items=t?.checklist?.items||[],hasWorkflow=publishedChecklistRules().length>0;return `<section class="nx-story-checklist"><div class="row spread"><h3>${hasWorkflow?'Story-specific steps':'Checklist'}</h3><span data-checklist-progress class="muted small">${items.filter(c=>c.done).length}/${items.length} complete</span></div>${hasWorkflow?'<p class="muted small">The workflow checklist is already attached below. Add any extra steps specific to this story here.</p>':`<label>Attach a template<select data-attach-checklist><option value="">Choose a template…</option>${checklistLibrary().map(c=>`<option value="${c.id}">${esc(c.name)} · ${c.items.length} items</option>`).join('')}</select></label><p class="muted small">Templates add a separate copy to this story. Existing items are kept.</p>`}<div data-story-checklist-items>${ticketChecklistMarkup(items)}</div><div class="row"><input data-new-check-item placeholder="Add a checklist item" aria-label="New checklist item"><button type="button" data-add-check-item>Add item</button></div></section>`;}
function readStoryChecklist(){return [...root.querySelectorAll('#clean-ticket-form [data-story-checklist-items] .nx-story-check')].map(row=>({text:row.querySelector('span').textContent,done:row.querySelector('input').checked}));}
function refreshStoryChecklist(items){root.querySelector('[data-story-checklist-items]').innerHTML=ticketChecklistMarkup(items);root.querySelector('[data-checklist-progress]').textContent=items.filter(c=>c.done).length+'/'+items.length+' complete';}
root.addEventListener('change',e=>{if(e.target.matches('[data-attach-checklist]')){const c=checklistLibrary().find(c=>c.id===e.target.value);if(!c)return;const items=readStoryChecklist();c.items.forEach(text=>{if(!items.some(i=>i.text===text))items.push({text,done:false});});refreshStoryChecklist(items);e.target.value='';}if(e.target.matches('[data-story-check]')){const items=readStoryChecklist();root.querySelector('[data-checklist-progress]').textContent=items.filter(c=>c.done).length+'/'+items.length+' complete';}});
root.addEventListener('click',e=>{if(e.target.closest('[data-add-check-item]')){const input=root.querySelector('[data-new-check-item]'),text=input.value.trim();if(text){refreshStoryChecklist([...readStoryChecklist(),{text,done:false}]);input.value='';}return;}const b=e.target.closest('[data-checklist-template]');if(!b)return;const action=b.dataset.checklistTemplate,t=checklistLibrary().find(t=>t.id===b.dataset.templateId);if(action==='duplicate'){checklistLibrary().push({id:'template-'+Date.now(),name:t.name+' copy',items:[...t.items]});render();save();return;}uxDialog(`<h2 id="ux-title">${t?'Edit':'Create'} checklist template</h2><form id="nx-checklist-template-form" ${t?`data-id="${t.id}"`:''}><label>Name<input name="name" value="${esc(t?.name||'')}" required></label><label>Items · one per line<textarea name="items" rows="6" required>${esc(t?.items.join('\n')||'')}</textarea></label><p class="muted small">Applies to this project. Existing story checklists keep their own copy.</p><p id="nx-checklist-error" role="alert"></p>${uxFooter()}</form>`);});
root.addEventListener('submit',e=>{if(e.target.id==='clean-ticket-form'){e.target.checklistPayload=readStoryChecklist();return;}if(e.target.id!=='nx-checklist-template-form')return;e.preventDefault();const f=new FormData(e.target),name=f.get('name').trim(),items=[...new Set(f.get('items').split('\n').map(i=>i.trim()).filter(Boolean))],id=e.target.dataset.id;if(!name||!items.length||checklistLibrary().some(t=>t.id!==id&&t.name.toLowerCase()===name.toLowerCase())){root.querySelector('#nx-checklist-error').textContent='Use a unique name and add at least one checklist item.';return;}if(id)Object.assign(checklistLibrary().find(t=>t.id===id),{name,items});else checklistLibrary().push({id:'template-'+Date.now(),name,items});root.querySelector('#ux-modal').close();render();save();});

function accessDescription(mode){return ({Private:'Only project admins and people added to this project can view, create, edit, and comment on its tickets.',Limited:'Everyone in your Nexa organization can view and comment. Only people added to this project can create and edit tickets.',Open:'Everyone in your Nexa organization can view, create, edit, and comment on tickets. Only project admins manage access and workflows.'})[mode];}
function members(){const visible=state.accessPeople.filter(p=>(p.name+' '+p.email).toLowerCase().includes(state.accessSearch.toLowerCase())&&(state.accessRole==='All roles'||p.role===state.accessRole));return `<section class="nx-access"><div class="row spread"><div><h1>Access Center</h1><p class="muted small">Manage the people who can work in this project.</p></div><div class="row">${button('Add people','accessadd','primary')}<button class="cursor-interaction" data-action="accessmode" aria-expanded="${state.accessMenu}">${esc(state.accessMode)} access ▾</button></div></div><p class="muted small">Project: ${esc(state.name)} · Applies to every board in this project</p>${state.accessMenu?`<div class="panel nx-access-menu"><h2>Change project access</h2><label>Access mode<select data-field="accessDraft">${['Private','Limited','Open'].map(m=>`<option ${m===state.accessDraft?'selected':''}>${m}</option>`).join('')}</select></label><p>${accessDescription(state.accessDraft)}</p><p class="muted small">Applies to all project boards and tickets. Open means your Nexa organization, not the public internet.</p>${state.accessDraft!==state.accessMode?'<div class="alert">'+(state.accessDraft==='Private'?'People outside the project will lose access.':state.accessDraft==='Limited'?'People in your organization will be able to view and comment.':'People in your organization will be able to create and edit tickets.')+'</div>':''}<div class="row">${button('Apply change','accessapplymode','primary')}${button('Cancel','accesscancelmode')}</div></div>`:''}<div class="nx-access-summary"><div><strong>${state.accessPeople.length} people</strong><p class="muted small">Across all project boards</p></div><div><strong>${esc(state.accessMode)} project</strong><p class="muted small">${accessDescription(state.accessMode)}</p></div><button data-action="accesspermissions">View role permissions</button></div><div class="nx-access-tabs" role="tablist" aria-label="Access Center tabs"><button role="tab" aria-selected="${state.accessTab==='users'}" data-action="accesstab:users" class="cursor-interaction ${state.accessTab==='users'?'active':''}">People</button><button role="tab" aria-selected="${state.accessTab==='requests'}" data-action="accesstab:requests" class="cursor-interaction ${state.accessTab==='requests'?'active':''}">Access requests <span class="tag">${state.accessRequests.length}</span></button></div>${state.accessTab==='users'?`<div class="row nx-access-filters"><label>Search<input id="nx-access-search" data-access="search" placeholder="Search name or email" value="${esc(state.accessSearch)}"></label><label>Role<select data-access="role">${['All roles','Admin','Member'].map(r=>`<option ${r===state.accessRole?'selected':''}>${r}</option>`).join('')}</select></label></div><div class="nx-access-table"><table><thead><tr><th>Person</th><th>Role</th><th></th></tr></thead><tbody>${visible.map(p=>`<tr><td><span class="nx-person"><span class="nx-avatar">${esc(p.name.slice(0,1))}</span><span>${esc(p.name)}${p.lead?'<span class="muted small"> · Lead</span>':''}<span class="nx-access-email muted small">${esc(p.email)}</span></span></span></td><td><select aria-label="Role for ${esc(p.name)}" data-access-person="${p.id}" ${p.lead?'disabled':''}>${['Admin','Member'].map(r=>`<option ${r===p.role?'selected':''}>${r}</option>`).join('')}</select></td><td>${p.lead?'<span class="muted small">Project lead</span>':button('Remove','accessremove:'+p.id)}</td></tr>`).join('')}</tbody></table>${visible.length?'':'<p class="muted">No users match your search.</p>'}</div>`:`<div class="panel"><h2>Access requests</h2>${state.accessRequests.length?state.accessRequests.map(p=>`<div class="row spread"><span>${esc(p.name)} · ${esc(p.email)}</span><div class="row">${button('Approve as Member','accessapprove:'+p.id,'primary')}${button('Decline','accessdecline:'+p.id)}</div></div>`).join(''):'<p class="muted">No pending requests.</p>'}</div>`}${state.accessAdd?`<div class="panel"><h2>Add people</h2><label>Existing Nexa user<select id="nx-access-user"><option>Jordan</option><option>Sam</option></select></label><label>Role<select id="nx-access-newrole"><option>Member</option><option>Admin</option></select></label><div class="row">${button('Add to project','accessconfirmadd','primary')}${button('Cancel','accesscancel')}</div></div>`:''}${state.accessRemove!==null?`<div class="alert"><h2>Remove project access?</h2><p>Reassign this person’s open tickets before removing them.</p><label>New owner<select id="nx-access-reassign"><option>Unassigned</option>${state.accessPeople.filter(p=>p.id!==state.accessRemove).map(p=>'<option>'+esc(p.name)+'</option>').join('')}</select></label><div class="row">${button('Reassign & remove','accessconfirmremove')}${button('Cancel','accesscancel')}</div></div>`:''}<p class="muted small">Sample accounts · Access changes are simulated in this mockup.</p><div id="nx-access-info"></div></section>`;}

function sprintItems(){return planning().items.filter(t=>t.phase==='sprint');}
function sprintSignals(t){return [t.blocker?'Blocked':'',t.owner==='Unassigned'?'No owner':''].filter(Boolean);}
function overview(){const p=planning(),items=sprintItems();return `<div class="row spread"><h1>Overview</h1>${button('Open sprint workspace','view:sprint','primary')}</div><p class="muted">${esc(state.name)} · ${esc(currentBoard().name)}</p><div class="grid"><div class="panel"><h2>${items.filter(t=>t.status==='Done').length} / ${items.length} completed</h2><p>Current sprint tickets · Count, not effort or goal achievement</p></div><div class="panel"><h2>${items.filter(t=>t.status!=='Done'&&sprintSignals(t).length).length} need attention</h2><p>Recorded blockers and missing owners</p></div></div><div class="panel"><h2>Project purpose</h2><p>${esc(state.purpose)}</p></div><h2>Needs attention</h2>${items.filter(t=>t.status!=='Done'&&sprintSignals(t).length).map(t=>`<div class="panel row spread"><div><strong>${esc(t.title)}</strong><p>${sprintSignals(t).join(' · ')} · ${esc(t.blocker||'')}</p></div>${button('Review ticket','uxdetail:'+t.id)}</div>`).join('')||'<p class="muted">No explicit attention signals in the current sprint. This is not a prediction of spillover.</p>'}${!p.sprint?button('Plan work','view:backlog'):''}`;}
function groupedBoardCard(t){const children=t.children||[];syncWorkflowRuleChecks(t);const checklistCount=Object.values(t.ruleChecks||{}).reduce((a,c)=>a+c.items.length,0),checklistDone=Object.values(t.ruleChecks||{}).reduce((a,c)=>a+c.items.filter(i=>i.done).length,0);return `<article class="nx-board-card ${t.blocker?'nx-card-blocked':''}" draggable="true" data-board-ticket="${t.id}"><div class="row spread nx-board-card-key">${t.key?`<span class="muted small">${esc(t.key)}</span>`:''}<span class="small">${esc(t.type||'Story')}</span></div><button class="nx-board-card-title" data-action="uxdetail:${t.id}">${esc(t.title)}</button><div class="row nx-board-card-tags"><span class="tag small">${esc(t.priority||'Medium')}</span>${t.blocker?'<span class="tag small nx-board-blocked">Blocked</span>':''}${children.length?'<span class="muted small">'+children.filter(c=>c.status==='Done').length+'/'+children.length+' child tasks</span>':''}</div><div class="row spread nx-board-card-footer"><span class="small">${esc(t.owner||'Unassigned')}</span><span class="muted small">${t.blocksStoryCompletion?'Included in story estimate':t.points!==undefined&&t.points!==''?esc(t.points)+' pts':'Not estimated'}</span></div>${checklistCount?`<button class="nx-board-checklist-link small" data-action="uxdetail:${t.id}">Checklist · ${checklistDone}/${checklistCount}</button>`:''}${t.blocker?`<div class="nx-card-blocker"><p class="small">${esc(t.blocker)}</p><p class="muted small">Resolution owner: ${esc(t.resolutionOwner||'Unassigned')}</p></div>`:''}${quickEpicLink(t)}<div class="nx-card-actions">${t.status!=='Done'?`<button data-board-block="${t.id}" class="small">${t.blocker?'Review blocker':'Mark blocked'}</button>`:''}<span class="muted small" data-board-grip draggable="true" aria-label="Drag ticket to move" style="cursor:grab;padding:6px">⠿ Drag to move</span></div></article>`;}
function boardSwimlaneCells(items,b){return `<div class="nx-swimlane-cells">${b.workflow.stages.map(stage=>{const tickets=items.filter(t=>(t.status||b.workflow.stages[0])===stage);return `<section class="nx-swimlane-cell" data-board-drop="${esc(stage)}" aria-label="${esc(stage)} tickets"><div class="nx-board-lane-body">${tickets.map(groupedBoardCard).join('')||'<p class="muted small nx-board-empty">No tickets</p>'}</div></section>`;}).join('')}</div>`;}
root.addEventListener('toggle',e=>{if(!e.target.matches('[data-swimlane]'))return;state.collapsedSwimlanes??={};state.collapsedSwimlanes[e.target.dataset.swimlane]=!e.target.open;},true);
function boardList(items,grouping){const row=t=>`<tr><td><button class="nx-list-ticket" data-action="uxdetail:${t.id}"><span class="muted small">${esc(t.key||'Draft')}</span><strong>${esc(t.title)}</strong></button>${t.blocker?'<span class="tag small">Blocked</span>':''}${t.children?.length?'<span class="muted small"> · '+t.children.length+' child tasks</span>':''}</td><td>${esc(t.type||'Story')}</td><td><span class="tag small">${esc(t.status||currentBoard().workflow.stages[0])}</span></td><td>${esc(t.owner||'Unassigned')}</td><td>${esc(t.priority||'Medium')}</td><td>${t.blocksStoryCompletion?'Included in story':t.points!==''&&t.points!=null?esc(t.points):'—'}</td><td>${quickEpicLink(t)}</td><td>${esc(t.dueDate||'—')}</td></tr>`;const keys=[...new Set(items.map(t=>workGroupKey(t,grouping)))];return `<div class="nx-board-list"><table><thead><tr><th scope="col">Ticket</th><th scope="col">Type</th><th scope="col">Status</th><th scope="col">Assignee</th><th scope="col">Priority</th><th scope="col">Points</th><th scope="col">Epic</th><th scope="col">Due date</th></tr></thead>${grouping==='none'?'<tbody>'+items.map(row).join('')+'</tbody>':keys.map(key=>{const group=items.filter(t=>workGroupKey(t,grouping)===key);return `<tbody><tr class="nx-list-group"><th colspan="8" scope="rowgroup">${esc(workGroupLabel(key,grouping))} <span class="muted small">· ${group.length} work items</span></th></tr>${group.map(row).join('')}</tbody>`;}).join('')}</table>${!items.length?'<p class="nx-clean-empty muted">No tickets to show. Add work or clear your filters.</p>':''}</div>`;}
function board(){if(state.boardDisplay==='calendar')return boardCalendar();const b=currentBoard(),p=planning(),all=p.items.filter(t=>t.phase==='board'||t.phase==='sprint'&&p.sprint?.active),q=(state.boardSearch||'').toLowerCase(),owner=state.boardOwnerFilter||'All owners',items=all.filter(t=>(!state.boardAttentionOnly||(t.status!=='Done'&&sprintSignals(t).length))&&(owner==='All owners'||t.owner===owner)&&(t.title+' '+(t.key||'')).toLowerCase().includes(q)),owners=[...new Set(all.map(t=>t.owner||'Unassigned'))],epics=timelineData();const grouping=state.boardGrouping||'epic',groups=items.length?[...new Set(items.map(t=>workGroupKey(t,grouping)))]:[''];return `<div class="row spread"><div><h1>${esc(b.name)}</h1><p class="muted small">${esc(state.name)} · ${b.type}${b.id===currentProject().defaultBoardId?' · Default board':''}</p></div><div class="row">${b.type==='Scrum'?button('Backlog','view:backlog')+button('Sprint workspace','view:sprint'):'<button class="primary" data-add-board-ticket>Add ticket</button>'}</div></div>${b.type==='Scrum'?`<div class="nx-board-sprint"><div><div class="nx-board-sprint-title"><strong>${p.sprint?.active?esc(p.sprint.name.replace(/\s*·\s*Launch essentials/i,'')):'No active sprint'}</strong>${p.sprint?.active?'<span class="tag nx-board-active">Active</span>':''}</div>${p.sprint?.active?'<p class="muted small"><strong>Sprint goal:</strong> '+esc(p.sprint.goal)+'</p>':'<p class="muted small">Plan and start a sprint from Backlog to bring work onto this board.</p>'}</div>${p.sprint?.active?'<div class="row nx-board-sprint-actions"><span class="muted small">'+esc(p.sprint.start)+' → '+esc(p.sprint.end)+'</span>'+button('Close sprint','uxclose')+'</div>':''}</div>`:''}${boardViewTabs()}<div class="nx-board-tools">${workGroupControl('board')}<label>Find a ticket<input data-board-search value="${esc(state.boardSearch||'')}" placeholder="Search title or key"></label><label>Owner<select data-board-owner><option>All owners</option>${owners.map(n=>`<option ${owner===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label class="nx-board-attention"><input type="checkbox" data-board-attention ${state.boardAttentionOnly?'checked':''}>Needs attention</label>${q||owner!=='All owners'||state.boardAttentionOnly?'<button data-board-reset>Clear filters</button>':''}</div><p class="muted small">${items.length===all.length?all.length+' tickets':items.length+' of '+all.length+' tickets'} · ${all.filter(t=>t.status==='Done').length} completed · ${state.boardDisplay==='list'?'Select a ticket to view details':'Drag cards between columns'}</p>${state.boardDisplay==='list'?boardList(items,grouping):`<div class="nx-board-swimlanes nx-unified-board" style="--nx-column-count:${b.workflow.stages.length}"><div class="nx-unified-header">${b.workflow.stages.map(stage=>`<div class="nx-board-lane-heading" data-board-drop="${esc(stage)}"><span class="nx-column-grip" draggable="true" data-column-drag="${esc(stage)}" aria-label="Drag ${esc(stage)} column to reorder" title="Drag to reorder">⠿</span><span class="nx-stage-dot ${stage==='Done'?'nx-stage-done':''}"></span><h2>${esc(stage)}</h2><span class="tag">${items.filter(t=>(t.status||b.workflow.stages[0])===stage).length}</span>${stage==='Done'?'<button class="nx-add-status" data-add-board-status aria-label="Add status" title="Add status">+</button>':''}</div>`).join('')}</div>${grouping==='none'?boardSwimlaneCells(items,b):groups.map(key=>{const grouped=items.filter(t=>workGroupKey(t,grouping)===key),epic=grouping==='epic'?epics.find(e=>e.id===key):null,done=grouped.filter(t=>t.status==='Done').length,collapseId=b.id+':'+grouping+':'+key;return `<details class="nx-unified-swimlane" data-swimlane="${esc(collapseId)}" ${state.collapsedSwimlanes?.[collapseId]?'':'open'}><summary><span class="nx-swimlane-chevron" aria-hidden="true">›</span><span class="nx-swimlane-icon" aria-hidden="true">${grouping==='epic'?'ϟ':'●'}</span>${epic?`<span class="muted small">${esc(epic.id)}</span>`:''}<strong>${esc(workGroupLabel(key,grouping))}</strong><span class="muted small">${grouped.length} work items</span>${grouped.length&&done===grouped.length?'<span class="tag small">Done</span>':`<span class="muted small">${done} completed</span>`}</summary>${boardSwimlaneCells(grouped,b)}</details>`;}).join('')}${!items.length&&all.length?'<p class="muted">No tickets match this view. Clear the filters to see more work.</p>':''}</div>`}`;}

root.addEventListener('change',e=>{if(e.target.matches('[data-board-search]'))state.boardSearch=e.target.value;else if(e.target.matches('[data-board-owner]'))state.boardOwnerFilter=e.target.value;else if(e.target.matches('[data-board-attention]'))state.boardAttentionOnly=e.target.checked;else return;render();});
root.addEventListener('click',e=>{if(e.target.closest('[data-board-reset]')){state.boardSearch='';state.boardOwnerFilter='All owners';state.boardAttentionOnly=false;render();}});

function sprintHistoryRecords(){const p=planning(),all=[...(p.sprintHistory||[]),...(p.sprint?.closed?[p.sprint]:[])],seen=new Set();return all.filter(s=>{const key=s.id||s.name+'|'+s.start;if(seen.has(key))return false;seen.add(key);return true;}).sort((a,b)=>b.end.localeCompare(a.end));}
function sprintHistoryCard(s){const r=s.review||{},unfinished=r.unfinished||0;return `<article class="panel"><div class="row spread"><strong>${esc(s.name)}</strong><span class="tag small">${unfinished?'Spillover':'No spillover'}</span></div><p class="muted small">${esc(s.start)} → ${esc(s.end)}</p>${unfinished?`<p><strong>${r.carriedStories??'—'} user stories · ${r.carriedPoints??'—'} story points carried over</strong></p>${r.unestimatedCarryover?`<p class="muted small">${r.unestimatedCarryover} carried-over ticket${r.unestimatedCarryover===1?' was':'s were'} unestimated; points total excludes those tickets.</p>`:''}<p>Carryover reason: ${esc(r.reason||'No reason recorded')}</p><p class="muted small">${unfinished} total tickets carried over. Points include all carried-over ticket types.</p>`:'<p>All selected work completed. No work carried over.</p>'}</article>`;}
function pastSprints(){const all=sprintHistoryRecords();return `<details class="nx-sprint-history"><summary>Past sprints · ${Math.min(3,all.length)} recent</summary>${all.slice(0,3).map(sprintHistoryCard).join('')||'<p class="muted">Closed sprint summaries will appear here.</p>'}${button('View all sprint history','view:sprintHistory')}</details>`;}
function sprintHistoryPage(){const all=sprintHistoryRecords(),q=(state.sprintHistoryQuery||'').toLowerCase(),filtered=all.filter(s=>s.name.toLowerCase().includes(q)),pages=Math.max(1,Math.ceil(filtered.length/10));state.sprintHistoryPage=Math.min(state.sprintHistoryPage||0,pages-1);const page=state.sprintHistoryPage;return `<div class="row spread"><div><h1>Sprint history</h1><p class="muted">${esc(state.name)} / ${esc(currentBoard().name)}</p></div>${button('← Sprint Workspace','view:sprint')}</div><label>Find a sprint<input id="history-search" value="${esc(state.sprintHistoryQuery||'')}" placeholder="Search by sprint name"></label><p class="muted small">${filtered.length} closed sprint${filtered.length===1?'':'s'} · Historical records are retained beyond the workspace preview.</p>${filtered.slice(page*10,page*10+10).map(sprintHistoryCard).join('')||'<div class="panel"><p>No matching closed sprints.</p></div>'}<div class="row spread"><button data-history-page="previous" ${page===0?'disabled':''}>Previous</button><span>Page ${page+1} of ${pages}</span><button data-history-page="next" ${page===pages-1?'disabled':''}>Next</button></div>`;}
root.addEventListener('change',e=>{if(e.target.id!=='history-search')return;state.sprintHistoryQuery=e.target.value;state.sprintHistoryPage=0;render();});
root.addEventListener('click',e=>{const b=e.target.closest('[data-history-page]');if(!b)return;state.sprintHistoryPage=(state.sprintHistoryPage||0)+(b.dataset.historyPage==='next'?1:-1);render();});
function sprintWorkspace(){const boards=currentProject().boards.filter(b=>b.type==='Scrum');if(!boards.length)return `<h1>Sprint Workspace</h1><div class="panel"><h2>No Scrum boards yet</h2><p>Create a Scrum board to plan and run sprints.</p>${button('Add board','view:newboard','primary')}</div>${button('← Active sprints','view:activeSprints')}`;if(currentBoard().type!=='Scrum'){state.boardId=boards[0].id;applyWorkflow(currentBoard().workflow);}return `<div class="row spread nx-sprint-toolbar">${button('← Active sprints','view:activeSprints')}<label style="margin:0">Scrum board<select data-planning-board="true">${boards.map(b=>`<option value="${b.id}" ${b.id===state.boardId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label></div><p class="muted small">${esc(state.name)} / ${esc(currentBoard().name)}</p>`+sprintWorkspaceContent()+pastSprints();}
function sprintWorkspaceContent(){const p=planning(),s=p.sprint,items=sprintItems();if(!s)return `<h1>Sprint Workspace</h1><div class="panel"><h2>No current sprint</h2><p>Prepare and select work in Backlog, then start the next sprint.</p>${button('Open backlog','view:backlog','primary')}</div>`;const done=items.filter(t=>t.status==='Done').length,attention=items.filter(t=>t.status!=='Done'&&sprintSignals(t).length),date=x=>new Date(x+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});let body=`<div class="row spread nx-sprint-heading"><div><div class="row"><h1>${esc(s.name)}</h1><span class="tag">${s.closed?'Closed':s.active?'Active':'Planned'}</span></div><p class="muted">${date(s.start)} – ${date(s.end)}</p></div><div class="row">${!s.closed?button('Open board','view:board','primary'):''}${button('Backlog','view:backlog')}${s.active?button('Close sprint','uxclose'):''}</div></div><div class="nx-sprint-goal"><span class="muted small">SPRINT GOAL</span><p>${esc(s.goal)}</p></div>`;
if(s.closed)return body+`<section class="panel"><h2>Sprint outcome</h2><p><strong>${esc(s.review.outcome)}</strong></p><div class="row"><span>${s.review.completed} completed</span><span>${s.review.unfinished} returned to backlog</span></div><p><strong>${s.review.unfinished?'Spillover: '+s.review.carriedStories+' user stories · '+s.review.carriedPoints+' story points carried over':'No spillover'}</strong></p><p class="muted">Carryover reason: ${esc(s.review.reason)}</p>${button('Plan next sprint','view:backlog','primary')}</section>`;
body+=`<div class="nx-sprint-metrics"><div><span class="muted small">Completed</span><h2>${done} / ${items.length}</h2><div class="progress" role="progressbar" aria-label="Completed tickets" aria-valuemin="0" aria-valuemax="${Math.max(1,items.length)}" aria-valuenow="${done}"><div style="width:${items.length?done/items.length*100:0}%"></div></div></div><div><span class="muted small">Needs attention</span><h2>${attention.length} ticket${attention.length===1?'':'s'}</h2><p class="muted small">Blocked or missing an owner</p></div><div><span class="muted small">Scope changes</span><h2>${s.changes?.length||0}</h2><p class="muted small">${s.baseline===undefined?'Baseline captured when started':s.baseline+' tickets'+(s.baselinePoints!==undefined?' · '+s.baselinePoints+' points':'')+' at sprint start'}</p></div></div><p class="muted small">Completion counts tickets, not effort or sprint-goal achievement.</p>`;
body+=`<section class="nx-sprint-section"><div class="row spread"><h2>Needs attention</h2></div>${attention.length?attention.slice(0,5).map(t=>`<div class="nx-sprint-attention"><div><button class="nx-work-title" data-action="uxdetail:${t.id}">${esc(t.title)}</button><p class="muted small">${sprintSignals(t).join(' · ')}${t.blocker?' · '+esc(t.blocker):''}</p>${t.blocker?'<p class="muted small">Resolution owner: '+esc(t.resolutionOwner||'Unassigned')+'</p>':''}</div>${button('Review','uxdetail:'+t.id)}</div>`).join(''):'<p class="muted">No recorded blockers or missing owners.</p>'}</section>${attention.length>5?`<p class="muted small">Showing 5 of ${attention.length} attention items.</p>${button('View all on board','uxattentionboard')}`:''}<details class="nx-sprint-history"><summary>Scope history · ${s.changes?.length||0} changes</summary>${(s.changes||[]).map(c=>'<p class="nx-sprint-log">'+esc(c)+'</p>').join('')||'<p class="muted">No changes recorded.</p>'}</details>`;return body;}
function uxDialog(body){let d=root.querySelector('#ux-modal');if(!d){d=document.createElement('dialog');d.id='ux-modal';d.setAttribute('aria-labelledby','ux-title');root.appendChild(d);}d.classList.remove('nx-modern-ticket','nx-epic-story-transition');d.innerHTML=body;d.showModal();}
function uxFooter(){return `<div class="row"><button class="primary" type="submit">Save</button><button type="button" data-ux-cancel>Cancel</button></div>`;}
root.addEventListener('click',e=>{if(e.target.closest('[data-ux-cancel]')){root.querySelector('#ux-modal').close();return;}const a=e.target.closest('[data-action]')?.dataset.action;if(!a?.startsWith('ux'))return;const p=planning(),s=p.sprint;if(a==='uxstart'){if(!sprintItems().length){notice('Select ready work in the backlog first.');return;}s.active=true;s.closed=false;s.baseline=sprintItems().length;s.baselinePoints=sprintEstimate(sprintItems()).points;s.baselineScope=clone(sprintItems().map(t=>({id:t.id,key:t.key,points:t.points,type:t.type})));s.changes=[];render();save();return;}
if(a.startsWith('uxdetail:')){const t=p.items.find(t=>t.id===a.slice(9));cleanTicketDialog(t.phase,t.id);return;}
if(a==='uxadd'){const ready=p.items.filter(t=>t.phase==='ready');if(!ready.length){notice('Refine work and mark it ready in the backlog first.');return;}uxDialog(`<h2 id="ux-title">Add ready work to active sprint</h2><form data-ux-form="add"><label>Ticket<select name="id">${ready.map(t=>`<option value="${t.id}">${esc(t.title)}</option>`).join('')}</select></label><label>Reason<textarea name="reason" required></textarea></label><p>Confirm the trade-off with your team.</p>${uxFooter()}</form>`);}
if(a.startsWith('uxremove:'))uxDialog(`<h2 id="ux-title">Remove work from sprint</h2><form data-ux-form="remove" data-id="${a.slice(9)}"><label>Reason<textarea name="reason" required></textarea></label><p>Returns to Ready for Sprint.</p>${uxFooter()}</form>`);
if(a==='uxclose')uxDialog(`<h2 id="ux-title">Close sprint</h2><form data-ux-form="close"><label>Goal outcome<select name="outcome"><option>Achieved</option><option>Partially achieved</option><option>Not achieved</option></select></label><label>Carryover reason / review note<textarea name="reason" required></textarea></label><p>Unfinished work returns to Ready for Sprint. Completed work stays in sprint history.</p>${uxFooter()}</form>`);
});
root.addEventListener('change',e=>{if(!e.target.dataset.uxStatus)return;const t=planning().items.find(t=>t.id===e.target.dataset.uxStatus);if(e.target.value==='Done'&&unfinishedStoryBugs(t).length){e.target.value=t.status;notice('Resolve the required linked bugs before completing this story.');return;}if(e.target.value==='Done'&&(t.blocker||(t.children||[]).some(c=>c.status!=='Done'))){e.target.value=t.status||currentBoard().workflow.stages[0];notice('Resolve the blocker and unfinished child tasks before completion.');return;}if(workflowRuleMissing(t,e.target.value).length||(e.target.value==='Done'&&doneChecklistRemaining(t).length)){const target=e.target.value;e.target.value=t.status||currentBoard().workflow.stages[0];transitionChecklistDialog(t,target);return;}triggerWorkflowRules(t,e.target.value);render();save();});
root.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.uxForm)return;e.preventDefault();const d=new FormData(f),p=planning(),s=p.sprint,t=p.items.find(t=>t.id===(f.dataset.id||d.get('id')));switch(f.dataset.uxForm){case 'detail':t.owner=d.get('owner').trim();t.criteria=d.get('criteria').trim();t.testContext=d.get('context').trim();t.blocker=d.get('blocker').trim();t.resolutionOwner=d.get('help').trim();break;case 'add':t.phase='sprint';t.status??=currentBoard().workflow.stages[0];(s.changes??=[]).push('Added '+t.title+': '+d.get('reason').trim());break;case 'remove':t.phase='ready';(s.changes??=[]).push('Removed '+t.title+': '+d.get('reason').trim());break;case 'close':{const items=sprintItems();s.review={completed:items.filter(t=>t.status==='Done').length,unfinished:items.filter(t=>t.status!=='Done').length,carriedStories:items.filter(t=>t.status!=='Done'&&t.type==='Story').length,carriedPoints:items.filter(t=>t.status!=='Done').reduce((sum,t)=>sum+(Number(t.points)||0),0),unestimatedCarryover:items.filter(t=>t.status!=='Done'&&(t.points===''||t.points===undefined)).length,outcome:d.get('outcome'),reason:d.get('reason').trim()};s.history=clone(items);items.filter(t=>t.status!=='Done').forEach(t=>{t.phase='ready';t.carryoverFrom=s.name;});s.active=false;s.closed=true;break;}}root.querySelector('#ux-modal').close();render();save();notice('Updated in this prototype.');});

const boardEditors=new Map();let creationEditor=null;
function makeEditor(stages){return stages.map((name,i)=>({id:'stage-'+i+'-'+Date.now(),name,original:name}));}
function editingStages(mode){if(mode==='new'){if(!creationEditor||creationEditor.type!==state.newBoardType)creationEditor={type:state.newBoardType,open:false,stages:makeEditor(currentProject().defaults[state.newBoardType].stages)};return creationEditor.stages;}if(!boardEditors.has(currentBoard()))boardEditors.set(currentBoard(),makeEditor(currentBoard().workflow.stages));return boardEditors.get(currentBoard());}
function stageEditor(mode){const stages=editingStages(mode);return `<div class="panel"><h2>Workflow stages</h2><p class="muted small">Starting and completed stages stay fixed. Customize intermediate stages.</p>${stages.map((s,i)=>`<div class="row" style="margin:10px 0"><label style="flex:1;min-width:150px;margin:0">${i===0?'Starting stage':i===stages.length-1?'Completed stage':'Intermediate stage'}<input data-we-name="${mode}" data-we-id="${s.id}" value="${esc(s.name)}" ${i===0||i===stages.length-1?'disabled':''}></label>${i>0&&i<stages.length-1?`<div class="row"><button type="button" data-we-action="up" data-we-mode="${mode}" data-we-id="${s.id}" aria-label="Move ${esc(s.name)} up" ${i===1?'disabled':''}>↑</button><button type="button" data-we-action="down" data-we-mode="${mode}" data-we-id="${s.id}" aria-label="Move ${esc(s.name)} down" ${i===stages.length-2?'disabled':''}>↓</button><button type="button" data-we-action="remove" data-we-mode="${mode}" data-we-id="${s.id}" aria-label="Remove ${esc(s.name)}">Remove</button></div>`:''}</div>`).join('')}<button type="button" data-we-action="add" data-we-mode="${mode}">+ Add stage</button></div>`;}
function workflow(){return `<h1>Workflows</h1><p class="muted">Edit this board’s workflow. Other boards are unaffected.</p><label>Board<select data-workflow-board="true">${currentProject().boards.map(b=>`<option value="${b.id}" ${b.id===state.boardId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></label>${stageEditor('settings')}${workflowChecklistControls()}<div class="row"><button class="primary" data-we-action="publish">Review & publish</button><button data-we-action="reset">Discard edits</button>${button('Back to board','view:board')}</div>`;}
function newBoardPage(){const stages=editingStages('new');return `<div class="form"><h1>Add board</h1><p class="muted">${esc(state.name)} · Shared project access</p><label>Board name<input data-field="newBoardName" value="${esc(state.newBoardName)}" placeholder="e.g. Platform delivery"></label><label>Board type<select data-field="newBoardType"><option ${state.newBoardType==='Kanban'?'selected':''}>Kanban</option><option ${state.newBoardType==='Scrum'?'selected':''}>Scrum</option></select></label><p class="muted small">Changing board type restores that type’s default stages.</p><label>Board owner<select data-field="newBoardOwner">${state.accessPeople.map(p=>`<option ${p.name===state.newBoardOwner?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="flow"><span>${stages.map(s=>esc(s.name)).join(' → ')}</span></div><button data-we-action="toggle">${creationEditor.open?'Hide customization':'Customize workflow'}</button>${creationEditor.open?stageEditor('new'):''}<p class="muted small">This board inherits project members and access. Edit its stages later in Settings → Workflows.</p><div class="row">${button('Create board','createboard','primary')}${button('Cancel','view:overview')}</div></div>`;}
function validEditor(mode){const names=editingStages(mode).map(s=>s.name.trim());if(names.some(n=>!n)||new Set(names.map(n=>n.toLowerCase())).size!==names.length){notice('Each stage needs a nonempty, unique name.');return false;}return true;}
function occupiedStatuses(){const values=[];for(const t of planning().items){values.push(t.status||currentBoard().workflow.stages[0]);for(const c of t.children||[])values.push(c.status);}return new Set(values);}
root.addEventListener('input',e=>{if(!e.target.dataset.weName)return;const item=editingStages(e.target.dataset.weName).find(s=>s.id===e.target.dataset.weId);item.name=e.target.value;});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.weAction;if(b.dataset.action==='createboard'){e.stopImmediatePropagation();if(!state.newBoardName.trim()){notice('Enter a board name.');return;}if(currentProject().boards.some(x=>x.name.toLowerCase()===state.newBoardName.trim().toLowerCase())){notice('Choose a unique board name within this project.');return;}if(!validEditor('new'))return;const names=editingStages('new').map(s=>s.name.trim());const board={id:'board-'+Date.now(),name:state.newBoardName.trim(),type:state.newBoardType,owner:state.newBoardOwner,workflow:{...clone(currentProject().defaults[state.newBoardType]),stages:names,source:creationEditor.open?'Customized':'Default'},planning:{items:[],sprint:null,demoVersion:2,childrenVersion:1}};currentProject().boards.push(board);state.boardId=board.id;state.newBoardName='';creationEditor=null;nav(board.type==='Scrum'?'backlog':'board');notice('Board created with your chosen workflow.');return;}if(!action)return;e.stopImmediatePropagation();if(action==='toggle'){creationEditor.open=!creationEditor.open;render();return;}if(action==='reset'){delete currentBoard().checklistRuleDraft;boardEditors.delete(currentBoard());applyWorkflow(currentBoard().workflow);render();return;}if(['add','remove','up','down'].includes(action)){const arr=editingStages(b.dataset.weMode),i=arr.findIndex(x=>x.id===b.dataset.weId);if(action==='add')arr.splice(arr.length-1,0,{id:'new-'+Date.now(),name:'New stage',original:null});if(action==='remove'&&i>0&&i<arr.length-1)arr.splice(i,1);if(action==='up'&&i>1)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];if(action==='down'&&i>0&&i<arr.length-2)[arr[i+1],arr[i]]=[arr[i],arr[i+1]];render();return;}
if(action==='publish'){if(!validEditor('settings'))return;const arr=editingStages('settings'),occupied=occupiedStatuses(),removed=currentBoard().workflow.stages.filter(old=>!arr.some(x=>x.original===old)&&occupied.has(old));uxDialog(`<h2 id="ux-title">Publish workflow</h2><p>Applies only to ${esc(currentBoard().name)}.</p><div class="panel"><h3>Checklist rules to publish</h3>${draftChecklistRules().map(r=>'<p>'+esc(ruleSentence(r))+' · '+esc(r.name)+' · '+(r.required?'Required':'Reminder')+'</p>').join('')||'<p>No checklist rules.</p>'}</div><p>${arr.map(x=>esc(x.name.trim())).join(' → ')}</p><form id="we-publish">${removed.map((old,i)=>`<label>Move tickets and child tasks from ${esc(old)} to<select name="map-${i}" data-old-stage="${esc(old)}" required><option value="">Choose destination</option>${arr.map(x=>`<option value="${esc(x.name.trim())}">${esc(x.name.trim())}</option>`).join('')}</select></label>`).join('')}<div class="row"><button type="submit" class="primary">Confirm & publish</button><button type="button" data-ux-cancel>Cancel</button></div></form>`);}
},true);
root.addEventListener('submit',e=>{if(e.target.id!=='we-publish')return;e.preventDefault();const arr=editingStages('settings'),mapping=new Map(arr.filter(x=>x.original).map(x=>[x.original,x.name.trim()]));e.target.querySelectorAll('[data-old-stage]').forEach(x=>mapping.set(x.dataset.oldStage,x.value));const oldStart=currentBoard().workflow.stages[0];for(const t of planning().items){if(t.status)t.status=mapping.get(t.status)||t.status;else t.status=mapping.get(oldStart);for(const c of t.children||[])c.status=mapping.get(c.status)||c.status;}currentBoard().workflow={...currentBoard().workflow,stages:arr.map(x=>x.name.trim()),gate:state.gate,workflowChecklist:state.workflowChecklist,source:'Customized'};currentBoard().workflow.doneChecklistItems=checklistLibrary().find(c=>c.name===state.workflowChecklist)?.items.slice()||[];planning().items.filter(t=>t.status!=='Done').forEach(t=>{ensureDoneChecklist(t);syncWorkflowRuleChecks(t);});delete currentBoard().draft;boardEditors.delete(currentBoard());applyWorkflow(currentBoard().workflow);root.querySelector('#ux-modal').close();render();save();notice('Workflow published. Existing work retained in mapped stages.');});

function activeSprintRows(){return projects.flatMap(project=>project.boards.filter(board=>board.type==='Scrum'&&board.planning?.sprint?.active&&!board.planning.sprint.closed).map(board=>{const items=board.planning.items.filter(t=>t.phase==='sprint');return {project,board,sprint:board.planning.sprint,items,done:items.filter(t=>t.status==='Done').length,attention:items.filter(t=>t.status!=='Done'&&sprintSignals(t).length).length};}));}
function activeSprintsPage(){const all=activeSprintRows(),q=(state.activeSprintSearch||'').toLowerCase(),projectId=state.activeSprintProject||'all',rows=all.filter(r=>(projectId==='all'||r.project.id===projectId)&&(!state.activeSprintAttention||r.attention>0)&&(projectName(r.project)+' '+r.board.name+' '+r.sprint.name+' '+r.sprint.goal).toLowerCase().includes(q));return `<div class="row spread"><div><h1>Active sprints</h1><p class="muted">See how delivery is moving across your projects.</p></div>${button('All projects','view:projects')}</div><div class="nx-active-summary"><div><strong>${all.length}</strong><span class="muted small">Running sprints</span></div><div><strong>${new Set(all.map(r=>r.project.id)).size}</strong><span class="muted small">Projects</span></div><div><strong>${all.filter(r=>r.attention>0).length}</strong><span class="muted small">Sprints needing attention</span></div></div><div class="nx-active-filters"><label>Find a sprint<input data-active-search value="${esc(state.activeSprintSearch||'')}" placeholder="Search sprint, board or goal"></label><label>Project<select data-active-project><option value="all">All projects</option>${projects.filter(p=>all.some(r=>r.project.id===p.id)).map(p=>`<option value="${p.id}" ${p.id===projectId?'selected':''}>${esc(projectName(p))}</option>`).join('')}</select></label><label class="nx-active-attention"><input type="checkbox" data-active-attention ${state.activeSprintAttention?'checked':''}>Needs attention</label></div><p class="muted small">${rows.length} sprint${rows.length===1?'':'s'} shown · Progress counts completed tickets.</p><div class="nx-active-grid">${rows.map(({project,board,sprint,items,done,attention})=>{const pct=items.length?Math.round(done/items.length*100):0;return `<article class="nx-active-card" data-active-sprint="${esc(project.id)}:${esc(board.id)}"><p class="muted small">${esc(projectName(project))} · ${esc(board.name)}</p><div class="row spread"><h2>${esc(sprint.name)}</h2><span class="tag">Active</span></div><p class="nx-active-goal"><span class="muted small">Sprint goal</span>${esc(sprint.goal||'No goal recorded')}</p><p class="muted small">${esc(sprint.start)} → ${esc(sprint.end)}</p><div class="row spread"><span class="small">${done} of ${items.length} tickets completed</span><strong class="small">${pct}%</strong></div><div class="progress" role="progressbar" aria-label="${esc(sprint.name)} completed tickets" aria-valuemin="0" aria-valuemax="${Math.max(1,items.length)}" aria-valuenow="${done}"><div style="width:${pct}%"></div></div><div class="nx-active-card-bottom"><span class="small ${attention?'nx-active-warning':'muted'}">${attention?attention+' ticket'+(attention===1?'':'s')+' need'+(attention===1?'s':'')+' attention':'No recorded attention items'}</span><button data-open-sprint-project="${esc(project.id)}" data-open-sprint-board="${esc(board.id)}">Open sprint →</button></div></article>`;}).join('')}</div>${!rows.length?`<div class="panel"><h2>${all.length?'No matching sprints':'No active sprints'}</h2><p class="muted">${all.length?'Adjust the search or filters to see more sprints.':'Plan and start a sprint from a Scrum board’s Backlog.'}</p>${all.length?'<button data-reset-active-filters>Clear filters</button>':button('Open Backlog','view:backlog','primary')}</div>`:''}<p class="muted small">Attention flags unfinished tickets with a blocker or no owner. Planned and closed sprints appear in their board’s workspace.</p>`;}
root.addEventListener('change',e=>{if(e.target.matches('[data-active-search]'))state.activeSprintSearch=e.target.value;else if(e.target.matches('[data-active-project]'))state.activeSprintProject=e.target.value;else if(e.target.matches('[data-active-attention]'))state.activeSprintAttention=e.target.checked;else return;render();});
root.addEventListener('click',e=>{if(!e.target.closest('[data-reset-active-filters]'))return;state.activeSprintSearch='';state.activeSprintProject='all';state.activeSprintAttention=false;render();});

root.addEventListener('click',e=>{const b=e.target.closest('[data-open-sprint-project]');if(!b)return;const project=projects.find(p=>p.id===b.dataset.openSprintProject),board=project?.boards.find(bd=>bd.id===b.dataset.openSprintBoard);if(!board?.planning?.sprint?.active||board.planning.sprint.closed){render();notice('That sprint is no longer active.');return;}if(project.id!==state.projectId)switchProject(project.id);state.boardId=board.id;applyWorkflow(board.workflow);nav('sprint');notice('Opened '+board.planning.sprint.name+' in '+projectName(project)+' / '+board.name+'.');});

function projectKeyError(value,id){if(!/^[A-Z][A-Z0-9]{1,9}$/.test(value))return 'Use 2–10 letters or numbers, starting with a letter.';if(projects.some(p=>p.id!==id&&p.key===value))return 'This project key is already in use.';return '';}
function suggestedTicketKey(){const prefix=currentProject().key;let n=1+Math.max(0,...currentProject().boards.flatMap(b=>(b.planning?.items||[]).map(t=>t.key?.startsWith(prefix+'-')?Number(t.key.slice(prefix.length+1))||0:0)));return prefix+'-'+n;}
function ticketKeyError(value){const prefix=currentProject().key;if(!value.startsWith(prefix+'-')||!/^[1-9][0-9]*$/.test(value.slice(prefix.length+1)))return 'Use '+prefix+' followed by a hyphen and a positive number, e.g. '+prefix+'-123.';if(projects.some(p=>p.boards.some(b=>(b.planning?.items||[]).some(t=>t.key===value))))return 'This ticket key is already in use. Choose another number.';return '';}
root.addEventListener('click',e=>{const edit=e.target.closest('[data-edit-project-key]');if(!edit)return;const project=projects.find(p=>p.id===edit.dataset.editProjectKey);uxDialog(`<h2 id="ux-title">Project key</h2><p class="muted">${esc(projectName(project))}</p><form id="nx-project-key-form" data-project="${project.id}"><label>Project key<input name="projectKey" value="${esc(project.key)}" maxlength="10" required style="text-transform:uppercase"></label><p class="muted small">Used for new ticket keys, such as ${esc(project.key)}-123. Existing ticket keys stay the same.</p><p id="nx-key-error" role="alert"></p>${uxFooter()}</form>`);});
root.addEventListener('submit',e=>{if(e.target.id!=='nx-project-key-form')return;e.preventDefault();const project=projects.find(p=>p.id===e.target.dataset.project),value=new FormData(e.target).get('projectKey').trim().toUpperCase(),error=projectKeyError(value,project.id);if(error){e.target.querySelector('#nx-key-error').textContent=error;return;}project.key=value;root.querySelector('#ux-modal').close();save();render();notice('Project key saved. New tickets will use '+value+'.');});
root.addEventListener('change',e=>{if(e.target.matches('[data-project-key-input]')){currentProject().key=e.target.value.trim().toUpperCase();e.target.value=currentProject().key;save();}});
function setup(){state.step=Math.min(state.step,2);const steps=['Project','First board','Workflow'];let body='';if(state.step===0)body=`<h2>Name your project</h2><p class="muted small">Give your team a shared place for their work.</p><label>Project name<input data-field="name" value="${esc(state.name)}" placeholder="e.g. Customer portal" required></label><label>Project key<input data-project-key-input value="${esc(currentProject().key)}" placeholder="e.g. PORTAL" maxlength="10" style="text-transform:uppercase" required></label><p class="muted small">Choose a unique short key. New tickets will use this prefix, for example ${esc(currentProject().key||'PORTAL')}-1.</p><label>Purpose (optional)<textarea data-field="purpose" rows="3" placeholder="What outcome are you working toward?">${esc(state.purpose)}</textarea></label>`;
if(state.step===1)body=`<h2>Create your first board</h2><p class="muted small">Start with one board. You can add more later.</p><label>Board name<input data-field="newBoardName" value="${esc(state.newBoardName)}" placeholder="e.g. Team delivery"></label><label>How does your team work?<select data-field="newBoardType"><option ${state.newBoardType==='Scrum'?'selected':''}>Scrum</option><option ${state.newBoardType==='Kanban'?'selected':''}>Kanban</option></select></label><div class="nx-setup-explanation"><strong>${state.newBoardType==='Scrum'?'Plan and deliver in sprints':'Keep work moving continuously'}</strong><p class="muted small">${state.newBoardType==='Scrum'?'Prepare tickets in Backlog, build a sprint, then start delivery on your board.':'Add tickets to the board and move them through your workflow as work progresses.'}</p></div>`;
if(state.step===2){const stages=editingStages('new');body=`<h2>Choose your workflow</h2><p class="muted small">The default stages are ready to use. Customize only if your team needs something different.</p><div class="flow">${stages.map(x=>'<span>'+esc(x.name)+'</span>').join('')}</div><button data-we-action="toggle">${creationEditor.open?'Hide customization':'Customize workflow'}</button>${creationEditor.open?stageEditor('new'):''}<div class="nx-setup-review"><h3>Ready to create</h3><p><strong>${esc(state.name)}</strong> <span class="tag">${esc(currentProject().key)}</span></p><p class="muted small">${esc(state.newBoardName)} · ${state.newBoardType} · First and default board</p><p class="muted small">You’ll land in ${state.newBoardType==='Scrum'?'Backlog':'your Board'}. Add teammates later in Access Center.</p></div>`;}
return `<div class="form nx-setup-flow"><div class="row spread"><h1>Create project</h1>${button('Save draft & exit','draft')}</div><p class="muted">Three quick steps to get your team’s work started.</p><ol class="nx-setup-steps">${steps.map((name,i)=>`<li class="${state.step===i?'current':i<state.step?'complete':''}" ${state.step===i?'aria-current="step"':''}><span>${i<state.step?'✓':i+1}</span>${name}</li>`).join('')}</ol><div class="panel">${body}</div><div class="row spread">${state.step?'<button data-setup-action="back">Back</button>':'<span></span>'}<button class="primary" data-setup-action="${state.step===2?'finish':'next'}">${state.step===2?'Create project':'Continue'}</button></div></div>`;}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.action==='newproject'){creationEditor=null;state.newBoardName='Team delivery';state.newBoardType='Scrum';state.setupPeople=[];return;}const a=b.dataset.setupAction;if(!a)return;e.stopImmediatePropagation();if(a==='back'){state.step=Math.max(0,state.step-1);render();return;}if(state.step===0&&projectKeyError(currentProject().key,currentProject().id)){notice(projectKeyError(currentProject().key,currentProject().id));return;}if(state.step===0&&!state.name.trim()){notice('Enter a project name to continue.');return;}if(state.step===1&&(!state.newBoardName.trim()||!validEditor('new'))){notice('Enter a board name and give each stage a unique name.');return;}if(a==='next'){state.step++;render();save();return;}if(a==='finish'||a==='finish-skip'){if(!validEditor('new'))return;const project=currentProject(),board=currentBoard();project.name=state.name.trim();state.name=project.name;board.name=state.newBoardName.trim();board.type=state.newBoardType;board.workflow={...clone(project.defaults[board.type]),stages:editingStages('new').map(x=>x.name.trim()),source:creationEditor.open?'Customized':'Default'};board.planning={items:[],sprint:null,demoVersion:2,childrenVersion:1};project.defaultBoardId=board.id;project.setupWorkflow=clone(board.workflow);state.accessPeople=[{id:1,name:'Anoop',email:'anoop@example.com',role:'Admin',lead:true},...(a==='finish-skip'?[]:state.setupPeople||[]).map((name,i)=>({id:i+2,name,email:name.toLowerCase()+'@example.com',role:'Member'}))];state.setupComplete=true;state.setupStarted=false;creationEditor=null;applyWorkflow(board.workflow);nav(board.type==='Scrum'?'backlog':'board');notice(board.type==='Scrum'?'Project created. Add and refine work, then plan your first sprint.':'Project created. Add your first ticket to get started.');}},true);

function plannedQueue(){const p=planning();if(!p.plannedSprints){p.plannedSprints=[];if(p.nextSprint)p.plannedSprints.push(p.nextSprint);}p.plannedSprints.forEach((x,i)=>{x.id??='planned-'+Date.now()+'-'+i;});p.nextSprint=p.plannedSprints[0];return p.plannedSprints;}
function selectedPlan(){const q=plannedQueue(),p=planning();return q.find(x=>x.id===p.selectedPlannedId)||q[0];}
function sprintEstimate(items){return {count:items.length,stories:items.filter(t=>t.type==='Story').length,points:items.reduce((sum,t)=>sum+(t.points!==''&&t.points!=null&&Number.isFinite(Number(t.points))?Number(t.points):0),0),unestimated:items.filter(t=>!t.blocksStoryCompletion&&(t.points===''||t.points==null)).length};}
function sprintEstimateSummary(items,interactive=false){const x=sprintEstimate(items);return `<div class="row nx-estimate-summary" aria-live="polite"><span>${x.count} tickets · ${x.stories} stories</span><strong>${x.points} points</strong>${x.unestimated?interactive?`<button data-show-unestimated>${x.unestimated} unestimated</button>`:`<span>${x.unestimated} unestimated</span>`:'<span class="muted small">All estimated</span>'}</div>`;}
function workGroupControl(scope){const selected=state[scope+'Grouping']||(scope==='board'?'epic':'none');return `<label class="nx-group-control">Group by<select data-work-group="${scope}">${[['none','None'],['epic','Epic'],['assignee','Assignee']].map(([v,label])=>`<option value="${v}" ${selected===v?'selected':''}>${label}</option>`).join('')}</select></label>`;}
function workGroupKey(t,mode){return mode==='assignee'?(t.owner?.trim()||'Unassigned'):mode==='epic'?(t.epicId||''):'';}
function workGroupLabel(key,mode){return mode==='assignee'?key:timelineData().find(e=>e.id===key)?.name||(key||'No epic');}
function groupedBacklogRows(items,renderRow){const mode=state.backlogGrouping||'none';if(mode==='none')return items.map(renderRow).join('');return [...new Set(items.map(t=>workGroupKey(t,mode)))].map(key=>{const rows=items.filter(t=>workGroupKey(t,mode)===key);return `<div class="nx-backlog-group"><div class="row nx-backlog-group-heading"><strong>${esc(workGroupLabel(key,mode))}</strong><span class="tag small">${rows.length}</span></div>${rows.map(renderRow).join('')}</div>`;}).join('');}
function quickEpicLink(t){return ['Story','Bug'].includes(t.type)?`<select class="nx-quick-epic" data-quick-epic="${t.id}" aria-label="Epic for ${esc(t.title)}"><option value="" ${t.type==='Story'?'disabled':''} ${!t.epicId?'selected':''}>${t.type==='Bug'?'No epic':'Select epic'}</option>${timelineData().map(epic=>`<option value="${epic.id}" ${t.epicId===epic.id?'selected':''}>${esc(epic.name)}</option>`).join('')}</select>`:'';}
root.addEventListener('change',e=>{if(e.target.dataset.workGroup){state[e.target.dataset.workGroup+'Grouping']=e.target.value;render();}if(e.target.dataset.quickEpic){const t=planning().items.find(t=>t.id===e.target.dataset.quickEpic);if(t&&(e.target.value||t.type==='Bug')){t.epicId=e.target.value;t.updatedAt=new Date().toISOString();render();save();notice(t.epicId?'Ticket linked to epic.':'Bug moved to No epic.');}}});
function backlog(){const p=planning(),scrum=currentBoard().type==='Scrum',s=p.sprint,active=s?.active&&!s.closed,queue=plannedQueue(),planned=active||s?.closed||queue.length?selectedPlan():s,queuePhase=active||queue.length?'nextSprint':'sprint';const sections=[['ready',scrum?'Ready for Sprint':'Ready to Start',scrum?'Prepared and eligible, but not selected for a sprint.':'Prepared work available to pull into delivery.'],['ideas','Brain Dump','Capture ideas without extra detail.'],['triage','Triage & Refinement','Clarify the problem and acceptance criteria.'],[scrum?queuePhase:'board',scrum?'Sprint Backlog':'On the Board',scrum?'Work selected for a specific sprint. Once started, manage it on the board.':'Work pulled into delivery.']];return `<div class="row spread"><div><h1>Backlog</h1><p class="muted small">${esc(state.name)} / ${esc(currentBoard().name)}</p></div><label style="margin:0">Board<select data-planning-board="true">${currentProject().boards.map(b=>`<option value="${b.id}" ${b.id===state.boardId?'selected':''}>${esc(b.name)} · ${b.type}</option>`).join('')}</select></label></div>${workGroupControl('backlog')}<p class="muted small">Drag using the grip beside a ticket, or use its section selector. Click the title to edit.</p>${scrum?`<section class="nx-clean-section"><h2>Current Sprint</h2>${active?`<div class="nx-clean-sprint" data-plan-drop="sprint" aria-label="Add work to current sprint"><div class="row spread"><strong>${esc(s.name)} <span class="tag small">Active</span></strong>${button('Open sprint','view:board')}</div><p>${esc(s.goal)}</p><p class="muted small">${esc(s.start)} → ${esc(s.end)} · ${sprintItems().length} tickets</p></div>`:'<p class="muted small">No sprint is running.</p>'}</section>`:''}<div class="nx-clean-backlog">${sections.map(([phase,title,help])=>{const items=p.items.filter(t=>t.phase===phase&&(phase!=='nextSprint'||!t.sprintPlanId||t.sprintPlanId===planned?.id)),isSprint=phase==='sprint'||phase==='nextSprint';return `<section class="nx-clean-section"><div class="row spread"><div class="row"><h2>${title}</h2><span class="tag small">${items.length}</span></div><div class="row">${isSprint?`<button data-clean-action="create-sprint">Create sprint</button><button class="primary" data-action="uxstart" ${!planned||!items.length||(queue.length&&planned.id!==queue[0].id)?'disabled':''}>Start Sprint</button>`:''}<button data-clean-add="${phase}">+ Add ticket</button></div></div><p class="muted small">${help}</p>${isSprint&&queue.length?`<label>Planned sprints · In start order<select data-planned-select>${queue.map((x,i)=>`<option value="${x.id}" ${x.id===planned?.id?'selected':''}>${i+1}. ${esc(x.name)}${i===0?' · Next to start':''}</option>`).join('')}</select></label>`:''}${isSprint&&queue.length>1?'<p class="muted small">Only the first planned sprint can start. Prepare later sprints using the selector.</p>':''}${isSprint&&active?'<p class="muted small">Plan the next sprint here. Start Sprint will guide you to close the current sprint first.</p>':''}${isSprint&&planned?`<div class="nx-clean-sprint"><strong>${esc(planned.name)} <span class="tag small">Planned</span></strong>${sprintEstimateSummary(items,true)}<p>${esc(planned.goal)}</p><p class="muted small">${esc(planned.start)} → ${esc(planned.end)}</p></div>`:''}${`<div class="nx-plan-drop nx-clean-drop" data-plan-drop="${phase}" aria-label="Move tickets to ${title}">${items.length?groupedBacklogRows(items,t=>`<article class="nx-clean-ticket" data-plan-card="${t.id}" draggable="true"><span class="nx-clean-drag" aria-hidden="true" draggable="true" data-plan-card="${t.id}" data-drag-handle>⠿</span><button class="nx-clean-title" draggable="false" data-clean-edit="${t.id}"><span class="muted small">${esc(t.key||'Draft')}</span> ${esc(t.title)}</button><div class="nx-backlog-ticket-fields">${quickEpicLink(t)}<span class="muted small nx-backlog-owner">${esc(t.owner)}${t.points!==''&&t.points!==undefined?' · '+esc(t.points)+' pts':''}</span>${t.blocker?'<span class="tag small">Blocked</span>':''}<select data-clean-move="${t.id}" aria-label="Move ${esc(t.title)}">${sections.map(([value,label])=>`<option value="${value}" ${value===phase?'selected':''}>${label}</option>`).join('')}</select></div></article>`):`<p class="nx-clean-empty muted small">${isSprint&&!planned?'Create a sprint or add a ticket to begin.':'No tickets yet.'}</p>`}</div>`}</section>`;}).join('')}</div>`;}
function relatedBugs(story){if(!story?.id)return [];return currentProject().boards.flatMap(b=>b.planning?.items||[]).filter(t=>t.type==='Bug'&&t.relatedStoryId===story?.id);}

function configureBugContext(form,t){const type=form.querySelector('[name="type"]'),aside=form.querySelector('.nx-ticket-properties'),main=form.querySelector('.nx-ticket-content');const section=document.createElement('section');section.dataset.bugContext='';section.innerHTML=`<h3>Bug context</h3><label>Affected story<select name="relatedStoryId"><option value="">No linked story</option>${currentProject().boards.flatMap(b=>b.planning?.items||[]).filter(x=>x.type==='Story').map(x=>`<option value="${x.id}" ${t?.relatedStoryId===x.id?'selected':''}>${esc(x.key||'')} ${esc(x.title)}</option>`).join('')}</select></label><label class="nx-bug-blocking"><input type="checkbox" name="blocksStoryCompletion" ${t?.blocksStoryCompletion?'checked':''}>Required to finish the affected story</label><p class="muted small">Required fixes stay within the story’s effort and prevent its completion. Separately planned bugs can have their own estimates.</p>`;aside.append(section);const guide=document.createElement('p');guide.className='muted small';guide.dataset.bugGuide='';guide.textContent='Describe steps to reproduce, actual result, expected result and environment in Description. Add screenshots in Attachments.';main.querySelector('[data-rich-wrapper]')?.after(guide);const update=()=>{const bug=type.value==='Bug';section.hidden=!bug;guide.hidden=!bug;const linked=section.querySelector('[name="relatedStoryId"]'),blocking=section.querySelector('[name="blocksStoryCompletion"]'),points=form.querySelector('[name="points"]');const affected=currentProject().boards.flatMap(b=>b.planning?.items||[]).find(x=>x.id===linked.value);blocking.disabled=!affected||affected.status==='Done';if(blocking.disabled)blocking.checked=false;if(points){points.disabled=bug&&blocking.checked;if(points.disabled)points.value='';}form.querySelector('[name="epicId"]').required=!bug;};type.addEventListener('change',update);section.addEventListener('change',update);update();if(t?.type==='Story'){const bugs=relatedBugs(t);if(bugs.length){const list=document.createElement('section');list.className='nx-linked-bugs';list.innerHTML=`<h3>Linked bugs · ${bugs.length}</h3>${bugs.map(b=>`<div class="row spread"><span>${esc(b.key||'')} ${esc(b.title)}</span><span class="tag small">${esc(b.status||'To Do')}</span></div>`).join('')}<p class="muted small">${unfinishedStoryBugs(t).length} unresolved required fixes.</p>`;main.append(list);}}}
function cleanTicketDialog(phase,id){const t=planning().items.find(t=>t.id===id);if(t)ensureDoneChecklist(t);const required=['ready','sprint','nextSprint','board'].includes(phase);if((phase==='nextSprint'&&!planning().nextSprint)||(phase==='sprint'&&(!planning().sprint||planning().sprint.closed))){state.pendingCleanPhase=phase;cleanSprintDialog();return;}uxDialog(`<h2 id="ux-title">${t?'Edit ticket':'Add ticket'} · ${esc(({ideas:'Brain Dump',triage:'Triage & Refinement',ready:'Ready',sprint:'Sprint Backlog',nextSprint:'Sprint Backlog',board:'On the Board'})[phase])}</h2><form id="clean-ticket-form" data-phase="${phase}" ${t?`data-id="${t.id}"`:''}><label>Title<input name="title" value="${esc(t?.title||'')}" required autofocus></label><label>Owner<select name="owner">${['Unassigned',...new Set(state.accessPeople.map(p=>p.name))].map(n=>`<option ${n===t?.owner?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>Description ${required?'':'(optional)'}<textarea name="description" ${required?'required':''}>${esc(t?.description||'')}</textarea></label><label>Acceptance criteria ${required?'':'(optional)'}<textarea name="criteria" ${required?'required':''}>${esc(t?.criteria||'')}</textarea></label><label>Additional Information <span class="muted small">(optional)</span><textarea name="additionalInformation" rows="9" placeholder="Add supporting context, notes, or details that do not fit above.">${esc(t?.additionalInformation||'')}</textarea></label>${configuredFields(t,'Parent tickets',true)}<div class="grid"><label>Type<select name="type"><option ${t?.type==='Story'?'selected':''}>Story</option><option ${t?.type==='Bug'?'selected':''}>Bug</option></select></label><label>Story points (optional)<select name="points">${['',1,2,3,5,8,13,...(t?.points===0?[0]:[])].map(n=>`<option value="${n}" ${String(t?.points??'')===String(n)?'selected':''}>${n===''?'Unestimated':n}</option>`).join('')}</select></label></div>${phase==='sprint'&&planning().sprint.active&&!t?'<label>Reason for adding work mid-sprint<textarea name="reason" required></textarea></label>':''}${expandedTicketFields(t)}${ticketChecklistSection(t)}${workflowRulesOnTicket(t)}<label>Epic<select name="epicId"><option value="">No epic</option>${timelineData().map(epic=>`<option value="${epic.id}" ${t?.epicId===epic.id?'selected':''}>${esc(epic.name)}</option>`).join('')}</select></label><div role="alert" id="clean-form-error"></div>${uxFooter()}</form>`);refineTicketLayout(t,phase);configureBugContext(root.querySelector('#clean-ticket-form'),t);}
root.addEventListener('click',e=>{if(!e.target.closest('[data-show-unestimated]'))return;const p=planning(),plan=selectedPlan()||p.sprint,phase=plannedQueue().length||p.sprint?.active?'nextSprint':'sprint';const items=p.items.filter(t=>t.phase===phase&&(phase!=='nextSprint'||!t.sprintPlanId||t.sprintPlanId===plan?.id)&&!t.blocksStoryCompletion&&(t.points===''||t.points==null));uxDialog(`<h2 id="ux-title">Unestimated work</h2><p class="muted small">Open a ticket to add its story-point estimate. Child tasks and epics are excluded from the sprint total.</p>${items.map(t=>`<button class="nx-unestimated-row" data-clean-edit="${t.id}"><span>${esc(t.key||'Draft')}</span> ${esc(t.title)} <span class="muted small">Add estimate →</span></button>`).join('')}<div class="row"><button data-ux-cancel>Close</button></div>`);});
